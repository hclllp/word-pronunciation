<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Usage Statistics</title><style>body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.title{font-size:22px;font-weight:780}.back{border:0;border-radius:8px;background:#e8ebee;padding:7px 10px;color:#4c5560}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:12px}.label{font-size:12px;color:#68717c}.value{font-size:28px;font-weight:780;margin-top:3px}.panel{margin-top:10px;background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:12px}.panel h2{font-size:15px;margin:0 0 10px}.meta{font-size:11px;color:#8a929b;margin-top:4px}.chart-wrap{position:relative;height:220px;border-bottom:1px solid #dfe3e7;padding:0 4px 0 8px}.chart-svg{width:100%;height:190px;display:block;overflow:visible}.grid{stroke:#e8ebee;stroke-width:1}.axis{stroke:#cfd5da;stroke-width:1}.line-dict{fill:none;stroke:#5b8def;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.line-school{fill:none;stroke:#e08b65;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.point-dict{fill:#5b8def}.point-school{fill:#e08b65}.y-label{font-size:10px;fill:#8a929b;text-anchor:end}.hour-labels{display:grid;grid-template-columns:repeat(24,1fr);gap:0;margin-top:2px}.hour{font-size:8px;color:#8a929b;text-align:center}.legend{display:flex;gap:14px;font-size:11px;color:#68717c;margin-top:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.d1{background:#5b8def}.d2{background:#e08b65}.error{color:#a32d2d;background:#fff1f0;border-radius:8px;padding:9px;font-size:12px}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.cards .stat:last-child{grid-column:1/-1}.value{font-size:24px}}</style></head><body><div class="app"><header class="top"><div><div class="title">API Usage Statistics</div><div class="meta" id="date">Loading…</div></div><button class="back" onclick="history.back()">返回</button></header><section class="cards"><div class="stat"><div class="label">Dictionary API</div><div class="value" id="dictionary">—</div></div><div class="stat"><div class="label">School Dictionary API</div><div class="value" id="school">—</div></div><div class="stat"><div class="label">今日总调用</div><div class="value" id="total">—</div></div></section><section class="panel"><h2>今日调用曲线</h2><div id="chart" class="chart-wrap"></div><div class="legend"><span><i class="dot d1"></i>Dictionary</span><span><i class="dot d2"></i>School Dictionary</span></div></section><section id="message" class="panel" style="display:none"></section></div><script>const API='https://word-pronunciation-api.hawkincasper.workers.dev/stats';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(hourly){const chart=document.getElementById('chart');const entries=Object.entries(hourly);const dict=entries.map(([,v])=>Number(v.dictionary)||0);const school=entries.map(([,v])=>Number(v.school)||0);const max=Math.max(1,...dict,...school);const W=960,H=190,PX=8,PY=10;const x=i=>entries.length<=1?W/2:PX+i*(W-PX*2)/(entries.length-1);const y=v=>H-PY-(v/max)*(H-PY*2);const path=values=>values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');const grid=[0,.25,.5,.75,1].map(f=>`<line class="grid" x1="${PX}" y1="${y(max*f)}" x2="${W-PX}" y2="${y(max*f)}"/><text class="y-label" x="${PX-2}" y="${y(max*f)+3}">${Math.round(max*f)}</text>`).join('');const dictPoints=dict.map((v,i)=>`<circle class="point-dict" cx="${x(i)}" cy="${y(v)}" r="2.8"><title>${entries[i][0]}:00 Dictionary ${v}</title></circle>`).join('');const schoolPoints=school.map((v,i)=>`<circle class="point-school" cx="${x(i)}" cy="${y(v)}" r="2.8"><title>${entries[i][0]}:00 School Dictionary ${v}</title></circle>`).join('');chart.innerHTML=`<svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Today's API usage line chart">${grid}<line class="axis" x1="${PX}" y1="${H-PY}" x2="${W-PX}" y2="${H-PY}"/><path class="line-dict" d="${path(dict)}"/><path class="line-school" d="${path(school)}"/>${dictPoints}${schoolPoints}</svg><div class="hour-labels">${entries.map(([h])=>`<div class="hour">${esc(h)}</div>`).join('')}</div>`}async function load(){try{const r=await fetch(API,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Stats request failed');document.getElementById('dictionary').textContent=data.dictionary;document.getElementById('school').textContent=data.school;document.getElementById('total').textContent=data.total;document.getElementById('date').textContent=`${data.date} · ${data.timezone}`;render(data.hourly)}catch(e){const m=document.getElementById('message');m.style.display='block';m.className='panel error';m.textContent='无法读取统计数据：'+e.message}}load();setInterval(load,60000)</script></body></html>
