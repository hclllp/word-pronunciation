<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Usage Statistics</title><style>body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:18px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.title{font-size:22px;font-weight:780}.back{border:0;border-radius:8px;background:#e8ebee;padding:7px 10px;color:#4c5560}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:12px}.label{font-size:12px;color:#68717c}.value{font-size:28px;font-weight:780;margin-top:3px}.panel{margin-top:10px;background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:12px}.panel h2{font-size:15px;margin:0 0 10px}.meta{font-size:11px;color:#8a929b;margin-top:4px}.chart{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;align-items:end;height:190px;border-bottom:1px solid #dfe3e7;padding:0 2px}.bar-wrap{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;min-width:0}.bars{height:160px;width:100%;display:flex;align-items:end;gap:1px}.bar{flex:1;min-height:1px;border-radius:2px 2px 0 0}.dict{background:#5b8def}.school{background:#e08b65}.hour{font-size:8px;color:#8a929b;margin-top:4px}.legend{display:flex;gap:14px;font-size:11px;color:#68717c;margin-top:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.d1{background:#5b8def}.d2{background:#e08b65}.error{color:#a32d2d;background:#fff1f0;border-radius:8px;padding:9px;font-size:12px}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.cards .stat:last-child{grid-column:1/-1}.value{font-size:24px}}</style></head><body><div class="app"><header class="top"><div><div class="title">API Usage Statistics</div><div class="meta" id="date">Loading…</div></div><button class="back" onclick="history.back()">返回</button></header><section class="cards"><div class="stat"><div class="label">Dictionary API</div><div class="value" id="dictionary">—</div></div><div class="stat"><div class="label">School Dictionary API</div><div class="value" id="school">—</div></div><div class="stat"><div class="label">今日总调用</div><div class="value" id="total">—</div></div></section><section class="panel"><h2>今日调用曲线</h2><div id="chart" class="chart"></div><div class="legend"><span><i class="dot d1"></i>Dictionary</span><span><i class="dot d2"></i>School Dictionary</span></div></section><section id="message" class="panel" style="display:none"></section></div><script>const API='https://word-pronunciation-api.hawkincasper.workers.dev/stats';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const r=await fetch(API,{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Stats request failed');document.getElementById('dictionary').textContent=data.dictionary;document.getElementById('school').textContent=data.school;document.getElementById('total').textContent=data.total;document.getElementById('date').textContent=`${data.date} · ${data.timezone}`;render(data.hourly)}catch(e){const m=document.getElementById('message');m.style.display='block';m.className='panel error';m.textContent='无法读取统计数据：'+e.message}}function render(hourly){const chart=document.getElementById('chart');const vals=Object.values(hourly);const max=Math.max(1,...vals.map(v=>Math.max(v.dictionary,v.school)));chart.innerHTML=Object.entries(hourly).map(([h,v])=>`<div class="bar-wrap"><div class="bars"><div class="bar dict" style="height:${Math.max(v.dictionary/max*100, v.dictionary?2:0)}%" title="${h}:00 Dictionary ${v.dictionary}"></div><div class="bar school" style="height:${Math.max(v.school/max*100, v.school?2:0)}%" title="${h}:00 School ${v.school}"></div></div><div class="hour">${h}</div></div>`).join('')}load();setInterval(load,60000)</script></body></html>
