<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Pronunciation Compare</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#20242a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:0 auto;padding:0 10px 30px}.top{position:sticky;top:0;z-index:20;background:#f6f7f8dd;backdrop-filter:blur(10px);border-bottom:1px solid #e1e5e9;display:flex;align-items:center;justify-content:space-between;padding:9px 0}.title{font-size:22px;font-weight:780}.top-actions{display:flex;gap:5px}.export-btn,.clear-btn{border:0;border-radius:7px;color:#fff;padding:5px 9px;font-size:13px}.export-btn{background:#59616b}.clear-btn{background:#d64545}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:box-shadow .16s ease,transform .16s ease}.card.open .brief{white-space:normal;overflow:visible;text-overflow:clip}.card.dragging{position:fixed!important;margin:0!important;z-index:1000!important;pointer-events:none!important;box-shadow:0 18px 45px #0004!important;transform:none!important;transition:none!important}.card.dragging *{pointer-events:none}.drag-placeholder{border:1px dashed #aeb7c0;background:#e9edf0;border-radius:10px;opacity:.75;pointer-events:none}.head{display:flex;align-items:center;gap:5px;min-height:28px}.word{font-size:20px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:4px;margin-left:3px;flex-wrap:wrap}.pron{display:flex;align-items:center;gap:4px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:17px}.ipa{font-size:14px;white-space:nowrap}.ipa::before,.ipa::after{content:'/';color:#68717c}.accent{font-size:9px;color:#68717c;font-weight:750}.close,.download{border:0;border-radius:6px;padding:3px 6px}.download{margin-left:auto;background:#e8edf1}.close{background:#f0f1f2}.summary{margin-top:2px}.brief{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details{display:none}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;margin:4px 0 2px}.defs{margin:0;padding-left:17px}.defs li{margin:3px 0;line-height:1.35;font-size:13px}.example{font-size:12px;color:#747d87}.loading{font-size:13px;color:#747d87}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px}.mw{font-size:10px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none;cursor:default;touch-action:auto}.search-row{display:flex;gap:5px;position:relative}.search-row input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:3px;transition:opacity .18s ease}.search-row input.hint-fade{opacity:.25}.search-row button{width:34px;height:30px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:19px}.search-hint,.comparison-hint{font-size:11px;color:#8a929b}.search-hint{padding-top:3px}.comparison-hint{text-align:center;margin:5px 2px 0;line-height:1.3}.comparison-example{font-size:11px;color:#6fa8dc;border:0;background:none}.speaker{display:inline-block;width:20px;height:20px;position:relative;color:#27303a}.speaker span{position:absolute;border-color:currentColor}.speaker .body{left:1px;top:7px;width:5px;height:8px;background:currentColor}.speaker .cone{left:5px;top:4px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}.speaker .wave1,.speaker .wave2,.speaker .wave3{border:1.7px solid currentColor;border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 50% 50% 0}.speaker .wave1{left:11px;top:6px;width:5px;height:8px}.speaker .wave2{left:13px;top:4px;width:8px;height:12px}.speaker .wave3{left:15px;top:2px;width:11px;height:16px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20242acc;color:#fff;padding:8px 12px;border-radius:8px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body><div class="app"><header class="top"><div class="title">Word Pronunciation Compare</div><div class="top-actions"><button id="clear" class="clear-btn">清空</button><button id="export" class="export-btn">导出🔗</button></div></header><main id="cards" class="cards"></main></div><div id="toast" class="toast"></div>
<script>
const MAX_WORDS=50,MIN_DOWNLOAD_DURATION=1.1,API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev',IPA_API_BASE='https://freedictionaryapi.com/api/v1/entries/en/';
const SEARCH_HINTS=['Search word ...','不知道怎么用，可以点点下方的example','可同时输入多个单词进行一键批量查询','长按卡片可以上下拖动调整位置','单击卡片展开详情介绍'];
const cards=document.getElementById('cards'),state=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}|\{b\}|\{\/b\}|\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}
function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return`https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}
function play(url,b){if(!url)return;b?.querySelectorAll('span').forEach(x=>x.classList.add('playing'));const a=new Audio(url);a.play().catch(()=>{});a.onended=()=>b?.querySelectorAll('span').forEach(x=>x.classList.remove('playing'))}
function parseWords(raw){return String(raw).split(/[\s,，;；.。]+/).map(x=>x.trim()).filter(Boolean)}
function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function exportLink(){const words=[...state.keys()];const url=`${location.origin}${location.pathname}?word_list=${encodeURIComponent(words.join(','))}`;navigator.clipboard?.writeText(url).catch(()=>{});showToast(`已保存当前页面的链接到剪贴板\n${url}`)}
document.getElementById('export').onclick=exportLink;document.getElementById('clear').onclick=()=>{state.clear();cards.innerHTML='';createSearch()};
function createSearch(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" placeholder="Search word ..." autocomplete="off"><button id="add">＋</button></div>';cards.append(el);const input=el.querySelector('#input'),submit=()=>addWords(input.value);el.querySelector('#add').onclick=submit;input.onkeydown=e=>{if(e.key==='Enter')submit()};let hi=0;setInterval(()=>{if(document.activeElement===input||input.value)return;input.classList.add('hint-fade');setTimeout(()=>{hi=(hi+1)%SEARCH_HINTS.length;input.placeholder=SEARCH_HINTS[hi];input.classList.remove('hint-fade')},180)},5000);const h=document.createElement('div');h.className='comparison-hint';h.innerHTML='It can be used to display multiple similar words and also to compare and learn pronunciation <button class="comparison-example">Example</button>';cards.append(h);h.querySelector('button').onclick=()=>addWords('dad dead')}
function addWords(raw){raw=String(raw||'').trim();if(raw.toLowerCase()==='$setting'){location.href='stats.html';return}const ws=[...new Set(parseWords(raw).map(x=>x.toLowerCase()))],nw=ws.filter(x=>!state.has(x));if(!nw.length)return;if(state.size+nw.length>MAX_WORDS)return showToast(`最多显示 ${MAX_WORDS} 个单词。`);document.getElementById('input').value='';const auto=ws.length===1;nw.forEach(w=>addWord(w,auto))}
function addWord(word,auto){const id=Math.random().toString(36).slice(2),search=document.querySelector('.search-card'),el=document.createElement('section');state.set(word,id);el.className='card';el.dataset.word=word;el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline"></div><button class="download" disabled>下载</button><button class="close">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;cards.insertBefore(el,search);el.querySelector('.close').onclick=e=>{e.stopPropagation();state.delete(word);el.remove()};el.querySelector('.download').onclick=e=>{e.stopPropagation();downloadWord(word,el)};el.onclick=e=>{if(el._clickBlocked)return;if(e.target.closest('button'))return;el.classList.toggle('open')};fetchData(word,el,auto)}
async function fetchData(word,el,auto){try{const [mw,fd]=await Promise.all([fetch(`${API_BASE}/lookup?word=${encodeURIComponent(word)}`).then(r=>r.json()),fetch(`${IPA_API_BASE}${encodeURIComponent(word)}`).then(r=>r.json())]);const ipa=fd?.[0]?.phonetics?.[0]?.ipa||fd?.[0]?.pronunciations?.[0]?.ipa||'';const fixed=String(ipa).replace(/ɛ/g,'e').replace(/ɹ/g,'r');const audio=mw?.audio||mw?.audioUrl||mw?.pronunciations?.[0]?.audio||null;el.querySelector('.pron-inline').innerHTML=ipa?`<span class="pron"><button class="speaker-btn"><span class="speaker"><span class="body"></span><span class="cone"></span><span class="wave1"></span><span class="wave2"></span><span class="wave3"></span></span></button><span class="ipa">${esc(fixed)}</span></span>`:'';const pb=el.querySelector('.speaker-btn');if(pb&&audio){pb.onclick=e=>{e.stopPropagation();play(audio,pb)};if(auto)play(audio,pb)}el.querySelector('.brief').textContent=cleanMW(mw?.brief||mw?.definition||mw?.short||'No definition found.');el.querySelector('.details').innerHTML=`<div class="pos">${esc(mw?.partOfSpeech||'')}</div><ul class="defs">${(mw?.definitions||[]).slice(0,8).map(d=>`<li>${esc(cleanMW(typeof d==='string'?d:d.definition||''))}</li>`).join('')}</ul><div class="example">${esc(mw?.example||'')}</div>`;const dl=el.querySelector('.download');if(audio){dl.disabled=false;dl.onclick=e=>{e.stopPropagation();downloadAudio(audio,word)}}}catch(e){el.querySelector('.brief').textContent='Search failed';el.querySelector('.details').innerHTML=`<div class="error">${esc(e.message||e)}</div>`}}
async function downloadAudio(url,word){try{const r=await fetch(url);const blob=await r.blob();const b=await blob.arrayBuffer();const wav=await ensureMinDuration(b,MIN_DOWNLOAD_DURATION);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));a.download=`${word}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){showToast('下载失败')}}
async function ensureMinDuration(buf,min){return buf}
function setupDrag(el){let pid=null,startX=0,startY=0,lastX=0,lastY=0,offsetX=0,offsetY=0,pressed=false,active=false,moved=false,timer=null,placeholder=null;const log=(name,o={})=>console.log('[touch-drag]',name,o);const cancelTimer=()=>{if(timer){clearTimeout(timer);timer=null}};const cleanup=reason=>{if(!active)return;el.classList.remove('dragging');if(placeholder){placeholder.replaceWith(el);placeholder=null}active=false;el.releasePointerCapture?.(pid);log('END',{reason,scrollY:window.scrollY})};const movePlaceholder=y=>{const others=[...cards.querySelectorAll('.card:not(.search-card):not(.dragging):not(.drag-placeholder)')];let target=null;for(const c of others){const r=c.getBoundingClientRect();if(y<r.top+r.height/2){target=c;break}}if(target)cards.insertBefore(placeholder,target);else cards.insertBefore(placeholder,document.querySelector('.search-card'))};const down=e=>{if(pid!==null)return;pid=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;offsetX=e.clientX-el.getBoundingClientRect().left;offsetY=e.clientY-el.getBoundingClientRect().top;lastScrollY=window.scrollY;pressed=true;moved=false;el.setPointerCapture?.(pid);timer=setTimeout(()=>{if(!pressed)return;active=true;el.classList.add('dragging');placeholder=document.createElement('div');placeholder.className='drag-placeholder';placeholder.style.height=el.getBoundingClientRect().height+'px';el.replaceWith(placeholder);cards.appendChild(el);el.style.width=placeholder.getBoundingClientRect().width+'px';el.style.left=(e.clientX-offsetX)+'px';el.style.top=(e.clientY-offsetY)+'px';log('START',{x:e.clientX,y:e.clientY})},420);log('DOWN',{x:e.clientX,y:e.clientY})};let lastScrollY=0;const move=e=>{if(pid!==e.pointerId)return;const x=e.clientX,y=e.clientY,dx=x-startX,dy=y-startY;if(!active){if(Math.hypot(dx,dy)>8){moved=true;pressed=false;cancelTimer();const deltaY=y-lastY;const sy=window.scrollY;window.scrollTo({top:Math.max(0,sy-deltaY),behavior:'auto'});lastScrollY=window.scrollY;log('SCROLL_FALLBACK',{x,y,deltaY,scrollY:window.scrollY})}lastX=x;lastY=y;return}e.preventDefault();e.stopPropagation();el.style.left=(x-offsetX)+'px';el.style.top=(y-offsetY)+'px';movePlaceholder(y);const edge=55;if(y<edge)window.scrollBy(0,-12);else if(y>innerHeight-edge)window.scrollBy(0,12);log('MOVE',{x,y,dx,dy,scrollY:window.scrollY,target:document.elementFromPoint(x,y)?.className||document.elementFromPoint(x,y)?.tagName||null});lastX=x;lastY=y};const up=e=>{if(pid!==e.pointerId)return;cancelTimer();if(active)cleanup('pointerup');else if(moved){el._clickBlocked=true;setTimeout(()=>el._clickBlocked=false,0)}pressed=false;pid=null};const abort=e=>{if(pid!==e.pointerId)return;cancelTimer();log('ABORT',{reason:e.type,scrollY:window.scrollY});if(active)cleanup(e.type);pressed=false;pid=null};el.addEventListener('pointerdown',down,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',up,{passive:false});document.addEventListener('pointercancel',abort,{passive:false})}
function init(){createSearch();const raw=new URLSearchParams(location.search).get('word_list');if(raw)addWords(raw)}init();
</script>
</body></html>
