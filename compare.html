<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Pronunciation Compare</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:0 12px 24px}.top{position:sticky;top:0;z-index:100;margin:0 -12px 6px;padding:10px 12px 7px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e1e5e9}.title{font-size:22px;font-weight:780}.top-actions{display:flex;gap:5px}.export-btn,.clear-btn{border:0;border-radius:7px;color:#fff;padding:5px 9px;font-size:13px}.export-btn{background:#59616b}.clear-btn{background:#d64545}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:box-shadow .16s ease,transform .16s ease}.card.open .brief{white-space:normal;overflow:visible;text-overflow:clip}.card.dragging{position:fixed!important;margin:0!important;z-index:1000!important;pointer-events:none!important;box-shadow:0 18px 45px #0004!important;transform:none!important;transition:none!important}.card.dragging *{pointer-events:none}.drag-placeholder{border:1px dashed #aeb7c0;background:#e9edf0;border-radius:10px;opacity:.75;pointer-events:none}.head{display:flex;align-items:center;gap:5px;min-height:28px}.word{font-size:20px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:4px;margin-left:3px;flex-wrap:wrap}.pron{display:flex;align-items:center;gap:4px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:17px}.ipa{font-size:14px;white-space:nowrap}.ipa::before,.ipa::after{content:'/';color:#68717c}.accent{font-size:9px;color:#68717c;font-weight:750}.close,.download{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:5px 7px;font-size:13px}.close{font-size:18px;padding:1px 6px}.download{margin-left:auto}.download:disabled{opacity:.5}.summary{padding-top:1px}.brief{font-size:13px;color:#414952;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}.details{display:none;margin-top:5px;border-top:1px solid #edf0f2;padding-top:5px}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;margin:4px 0 2px}.defs{margin:0;padding-left:17px}.defs li{margin:3px 0;line-height:1.35;font-size:13px}.example{font-size:12px;color:#747d87}.loading{font-size:13px;color:#747d87}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px}.mw{font-size:10px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none;cursor:default;touch-action:auto}.search-row{display:flex;gap:5px;position:relative}.search-row input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:3px;transition:opacity .18s ease}.search-row input.hint-fade{opacity:.25}.search-hint.hint-fade{opacity:.25}.search-row button{width:34px;height:30px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:19px}.search-hint,.comparison-hint{font-size:11px;color:#8a929b}.search-hint{padding-top:3px}.comparison-hint{text-align:center;margin:5px 2px 0;line-height:1.3}.comparison-example{font-size:11px;color:#6fa8dc;border:0;background:none}.speaker{display:inline-block;width:20px;height:20px;position:relative;color:#27303a}.speaker span{position:absolute;border-color:currentColor}.speaker .body{left:1px;top:7px;width:5px;height:8px;background:currentColor}.speaker .cone{left:5px;top:4px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}.speaker .wave1,.speaker .wave2,.speaker .wave3{border:1.7px solid currentColor;border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 50% 50% 0}.speaker .wave1{left:11px;top:6px;width:5px;height:9px}.speaker .wave2{left:12px;top:3px;width:7px;height:14px}.speaker .wave3{left:13px;top:1px;width:9px;height:18px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);width:min(92vw,620px);background:#202632;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.4;opacity:0;pointer-events:none;transition:.18s;z-index:1100}.toast.show{opacity:1;transform:translate(-50%,0)}body.reordering{cursor:grabbing;overflow:hidden}body.reordering .top{pointer-events:none}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="title">Word Pronunciation Compare</div><div class="top-actions"><button id="clear" class="clear-btn">清空</button><button id="export" class="export-btn">导出🔗</button></div></header><main id="cards" class="cards"></main></div><div id="toast" class="toast"></div>
<script>
const MAX_WORDS=50,MIN_DOWNLOAD_DURATION=1.1,API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev',IPA_API_BASE='https://freedictionaryapi.com/api/v1/entries/en/';
const SEARCH_HINTS=['不知道怎么用，可以点点下方的example','可同时输入多个单词进行一键批量查询','长按卡片可以上下拖动调整位置','单击卡片展开详情介绍'];
const cards=document.getElementById('cards'),state=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}|\{b\}|\{\/b\}|\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}
function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return`https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}
function play(url,b){if(!url)return;const a=new Audio(url);if(b)b.disabled=true;a.play().catch(console.warn).finally(()=>{if(b)b.disabled=false})}
function normalizeIPA(s){s=String(s??'').trim().replace(/^\s*(?:IPA|phonetic|phonetic transcription)\s*[:：]\s*/i,'').replace(/^\s*[\[\/]/,'').replace(/[\]\/) ]+$/,'').trim();return s.replaceAll('ɛ','e').replaceAll('ɹ','r')}
function isIPA(p){const t=String(p?.text||'');return t&&!/audio|sound|rhymes?|homophone|hyphenation/i.test(String(p?.type||'')+' '+String(p?.tags||''))&&(/[\u0250-\u02ff\u1d00-\u1d7f]/.test(t)||/[ˈˌɪiːʊuːəɑæʌɔɛɒɜɝɚθðʃʒŋ]/.test(t))}
function firstIPA(d){for(const e of d.entries||[])for(const p of e.pronunciations||[])if(isIPA(p)){const x=normalizeIPA(p.text);if(x)return x}return''}
function defs(entry){const out=[];for(const d of entry.def||[])for(const seq of d.sseq||[])for(const g of seq||[]){if(!Array.isArray(g)||g[0]!=='sense')continue;const o=g[1]||{},ts=[];for(const x of o.dt||[]){if(x[0]==='text')ts.push(cleanMW(x[1]));else if(x[0]==='vis')for(const v of x[1]||[])if(v?.t)ts.push('Example: '+cleanMW(v.t))}if(ts.length)out.push({text:ts[0],example:ts.find(x=>x.startsWith('Example:'))?.slice(9)});if(o.sdsense?.dt){const x=o.sdsense.dt.find(x=>x[0]==='text');if(x)out.push({text:cleanMW(x[1])})}}if(!out.length&&Array.isArray(entry.shortdef))for(const x of entry.shortdef){const text=cleanMW(x);if(text)out.push({text})}return out}
function writeWav(b){const c=b.numberOfChannels,r=b.sampleRate,n=b.length,ab=new ArrayBuffer(44+n*c*2),v=new DataView(ab);const w=(p,s)=>[...s].forEach((x,i)=>v.setUint8(p+i,x.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n*c*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,r,true);v.setUint32(28,r*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*c*2,true);let p=44,ch=Array.from({length:c},(_,i)=>b.getChannelData(i));for(let i=0;i<n;i++)for(let j=0;j<c;j++){let x=Math.max(-1,Math.min(1,ch[j][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
async function prepareAudio(url,el){try{const r=await fetch(url,{mode:'cors',cache:'no-store'});if(!r.ok)throw Error();const bytes=await r.arrayBuffer(),ctx=new(window.AudioContext||window.webkitAudioContext)(),buffer=await ctx.decodeAudioData(bytes.slice(0));try{await ctx.close()}catch{}el._audio={url,bytes,buffer,duration:buffer.duration};el.querySelector('.download').disabled=false}catch{el._audio={url,duration:null};el.querySelector('.download').disabled=false}}
async function downloadAudio(url,word,btn,el){const old=btn.textContent;btn.textContent='处理中…';try{let m=el._audio;if(!m||m.url!==url)await prepareAudio(url,el),m=el._audio;if(m.buffer&&m.duration<MIN_DOWNLOAD_DURATION){const frames=Math.ceil(m.buffer.sampleRate*MIN_DOWNLOAD_DURATION),ctx=new OfflineAudioContext(m.buffer.numberOfChannels,frames,m.buffer.sampleRate),s=ctx.createBufferSource();s.buffer=m.buffer;s.connect(ctx.destination);s.start();const blob=writeWav(await ctx.startRendering()),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${word}.wav`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else{const blob=new Blob([m.bytes],{type:'audio/mpeg'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${word}.mp3`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}catch{const a=document.createElement('a');a.href=url;a.download=`${word}.mp3`;a.click()}finally{btn.textContent=old}}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),5000)}
function parseWords(s){return s.split(/[\s,，;；.。]+/).map(x=>x.trim()).filter(Boolean)}
function currentWords(){return [...cards.querySelectorAll('.card[data-word]')].map(x=>x.dataset.word)}
function pageUrl(ws){const u=new URL(location.href);u.search='';if(ws.length)u.searchParams.set('word_list',ws.join(','));return u.toString()}
async function exportLink(){const ws=currentWords();if(!ws.length)return showToast('当前页面还没有单词。');const u=pageUrl(ws);try{await navigator.clipboard.writeText(u)}catch{const x=document.createElement('textarea');x.value=u;document.body.append(x);x.select();document.execCommand('copy');x.remove()}showToast('已保存当前页面的链接到剪贴板\n'+u)}
document.getElementById('export').onclick=exportLink;document.getElementById('clear').onclick=()=>{state.clear();cards.querySelectorAll('.card[data-word]').forEach(x=>x.remove());showToast('已清空所有单词。')};
function createSearch(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" placeholder="Search word ..." autocomplete="off" autocapitalize="none"><button id="add">＋</button></div><div class="search-hint">不知道怎么用，可以点点下方的example</div>';cards.append(el);const input=el.querySelector('#input'),hint=el.querySelector('.search-hint'),submit=()=>addWords(input.value);el.querySelector('#add').onclick=submit;input.onkeydown=e=>{if(e.key==='Enter')submit()};let hi=0;setInterval(()=>{if(document.activeElement===input||input.value)return;hint.classList.add('hint-fade');setTimeout(()=>{hi=(hi+1)%SEARCH_HINTS.length;hint.textContent=SEARCH_HINTS[hi];hint.classList.remove('hint-fade')},180)},5000);const h=document.createElement('div');h.className='comparison-hint';h.innerHTML='It can be used to display multiple similar words and also to compare and learn pronunciation <button class="comparison-example">Example</button>';cards.append(h);h.querySelector('button').onclick=()=>addWords('dad dead')}
function addWords(raw){raw=String(raw||'').trim();if(raw.toLowerCase()==='$setting'){location.href='stats.html';return}const ws=[...new Set(parseWords(raw).map(x=>x.toLowerCase()))],nw=ws.filter(x=>!state.has(x));if(!nw.length)return;if(state.size+nw.length>MAX_WORDS)return showToast(`最多显示 ${MAX_WORDS} 个单词。`);document.getElementById('input').value='';const auto=ws.length===1;nw.forEach(w=>addWord(w,auto))}
function addWord(word,auto){const id=Math.random().toString(36).slice(2),search=document.querySelector('.search-card'),el=document.createElement('section');state.set(word,id);el.className='card';el.dataset.word=word;el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline"></div><button class="download" disabled>下载</button><button class="close">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;cards.insertBefore(el,search);el.querySelector('.close').onclick=e=>{e.stopPropagation();state.delete(word);el.remove()};el.querySelector('.download').onclick=e=>{e.stopPropagation();downloadAudio(el._audio?.url,word,e.currentTarget,el)};setupDrag(el);el.onclick=e=>{if(e.target.closest('button')||el._dragHandled)return;if(el._clickBlocked){el._clickBlocked=false;return}el.classList.toggle('open')};fetchWord(word,el,auto)}
async function fetchWord(word,el,auto){try{const[mw,ip]=await Promise.all([fetch(API_BASE+'/lookup?word='+encodeURIComponent(word),{cache:'no-store'}),fetch(IPA_API_BASE+encodeURIComponent(word),{cache:'no-store'})]);const d=await mw.json();if(!mw.ok)throw Error(d.error||'Merriam-Webster error');const entry=d.entries?.[0];if(!entry)throw Error('No dictionary entry returned');let ipa='';if(ip.ok)try{ipa=firstIPA(await ip.json())}catch{}const prs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw),aid=prs.find(p=>p.sound?.audio)?.sound?.audio,url=audioUrl(aid),final=ipa||normalizeIPA(prs.find(p=>p.mw)?.mw||'');const pin=el.querySelector('.pron-inline');if(url||final)pin.innerHTML=`${url?`<button data-play title="播放"><span class="speaker"><span class="body"></span><span class="cone"></span><span class="wave1"></span><span class="wave2"></span><span class="wave3"></span></span></button>`:''}${final?`<span class="pron"><span class="ipa">${esc(final)}</span></span>`:''}`;const p=pin.querySelector('[data-play]');if(p)p.onclick=e=>{e.stopPropagation();play(url,p)};const ds=defs(entry),brief=el.querySelector('.brief'),details=el.querySelector('.details');brief.textContent=ds[0]?.text||'No definition available.';details.innerHTML=ds.map(x=>`<div class="pos">${esc(entry.fl||'')}</div><ul class="defs"><li>${esc(x.text)}</li></ul>${x.example?`<div class="example">${esc(x.example)}</div>`:''}`).join('')+`<div class="mw">Merriam-Webster</div>`;if(url)prepareAudio(url,el);if(auto&&url)play(url,p)}catch(e){el.querySelector('.brief').innerHTML=`<div class="error">${esc(e.message||'查询失败')}</div>`}}
function setupDrag(el){let timer=0,drag=false,startX=0,startY=0,lastX=0,lastY=0,offsetX=0,offsetY=0,placeholder=null,oldRect=null;const clear=()=>{clearTimeout(timer);timer=0};const cleanup=()=>{clear();if(drag){el.releasePointerCapture?.(el._pointerId);drag=false;document.body.classList.remove('reordering');el.classList.remove('dragging');el.style.left='';el.style.top='';if(placeholder){placeholder.replaceWith(el);placeholder=null}}el._dragHandled=true;setTimeout(()=>{el._dragHandled=false},0)};el.addEventListener('pointerdown',e=>{if(e.button!==0)return;el._pointerId=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;oldRect=el.getBoundingClientRect();offsetX=e.clientX-oldRect.left;offsetY=e.clientY-oldRect.top;el.setPointerCapture?.(e.pointerId);timer=setTimeout(()=>{drag=true;document.body.classList.add('reordering');oldRect=el.getBoundingClientRect();placeholder=document.createElement('div');placeholder.className='drag-placeholder';placeholder.style.height=oldRect.height+'px';placeholder.style.width=oldRect.width+'px';el.replaceWith(placeholder);document.body.appendChild(el);el.classList.add('dragging');el.style.width=oldRect.width+'px';el.style.left=(e.clientX-offsetX)+'px';el.style.top=(e.clientY-offsetY)+'px';el._clickBlocked=true},260)}, {passive:false});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture?.(e.pointerId))return;if(!drag)return; e.preventDefault();const dx=e.clientX-startX,dy=e.clientY-startY;el.style.left=(e.clientX-offsetX)+'px';el.style.top=(e.clientY-offsetY)+'px';const list=[...cards.querySelectorAll('.card[data-word]:not(.dragging)')];let before=null;for(const c of list){const r=c.getBoundingClientRect();if(e.clientY<r.top+r.height/2){before=c;break}}if(before)cards.insertBefore(placeholder,before);else{const search=document.querySelector('.search-card');cards.insertBefore(placeholder,search)}lastX=e.clientX;lastY=e.clientY},{passive:false});const end=e=>{clear();if(drag){e.preventDefault();cleanup()}else{el.releasePointerCapture?.(e.pointerId)}};el.addEventListener('pointerup',end,{passive:false});el.addEventListener('pointercancel',e=>{clear();if(drag)cleanup();else el.releasePointerCapture?.(e.pointerId)});el.addEventListener('pointerleave',()=>{});}
function scrollFallback(){let y=null;document.addEventListener('pointerdown',e=>{if(e.target.closest('.card:not(.search-card)'))return;y=e.clientY},{passive:true});document.addEventListener('pointermove',e=>{if(y==null)return;const dy=e.clientY-y;y=e.clientY;if(Math.abs(dy)>0)window.scrollBy(0,-dy)},{passive:true});document.addEventListener('pointerup',()=>{y=null},{passive:true});document.addEventListener('pointercancel',()=>{y=null},{passive:true})}
createSearch();scrollFallback();
const q=new URLSearchParams(location.search).get('word_list');if(q)addWords(q);else createSearch;
</script>
