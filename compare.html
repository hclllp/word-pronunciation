<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Pronunciation Compare</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:0 12px 24px}.top{position:sticky;top:0;z-index:10;margin:0 -12px 6px;padding:10px 12px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e1e5e9}.title{font-size:22px;font-weight:780;margin:2px 0}.top-actions{display:flex;align-items:center;gap:5px}.export-btn,.clear-btn{border:0;border-radius:7px;color:#fff;padding:5px 9px;font-size:13px;white-space:nowrap;cursor:pointer}.export-btn{background:#59616b}.clear-btn{background:#d64545}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006}.head{display:flex;align-items:center;gap:5px;min-height:28px}.word{font-size:20px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:4px;margin-left:3px;flex-wrap:wrap}.pron{display:flex;align-items:center;gap:4px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:17px;cursor:pointer}.pron button:disabled{opacity:.5}.ipa{font-size:14px;white-space:nowrap}.ipa::before,.ipa::after{content:'/';color:#68717c}.ipa.already-delimited::before,.ipa.already-delimited::after{content:none}.accent{font-size:9px;color:#68717c;font-weight:750;text-transform:uppercase}.close,.expand{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:5px 7px;font-size:13px}.close{font-size:18px;padding:1px 6px}.expand{margin-left:auto}.summary{padding-top:1px}.brief{font-size:13px;color:#414952;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}.card.open .brief{white-space:normal;overflow:visible;text-overflow:clip}.details{display:none;margin-top:5px;border-top:1px solid #edf0f2;padding-top:5px}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}.defs{margin:0;padding-left:17px}.defs li{margin:3px 0;line-height:1.35;font-size:13px}.example{font-size:12px;color:#747d87;margin-top:1px}.loading{font-size:13px;color:#747d87;padding:2px 0}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px;margin-top:3px}.mw{font-size:10px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none}.search-row{display:flex;gap:5px}.search-row input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;padding:3px 1px}.search-row button{width:34px;height:30px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:19px;font-weight:700}.search-hint{font-size:11px;color:#8a929b;padding:3px 1px 0}.speaker{display:inline-block;width:20px;height:20px;position:relative;color:#27303a}.speaker .body{position:absolute;left:1px;top:7px;width:5px;height:8px;border-radius:1px;background:currentColor}.speaker .cone{position:absolute;left:5px;top:4px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}.speaker .wave1,.speaker .wave2,.speaker .wave3{position:absolute;border:1.7px solid currentColor;border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 50% 50% 0}.speaker .wave1{left:11px;top:6px;width:5px;height:9px}.speaker .wave2{left:12px;top:3px;width:7px;height:14px}.speaker .wave3{left:13px;top:1px;width:9px;height:18px}.comparison-hint{font-size:11px;color:#8a929b;text-align:center;margin:5px 2px 0;line-height:1.3}.comparison-example{font-size:11px;color:#6fa8dc;margin-left:5px;text-decoration:none;cursor:pointer;white-space:nowrap}.comparison-example:hover{text-decoration:underline}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);width:min(92vw,620px);background:#202632;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.4;box-shadow:0 4px 18px #0003;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:20;word-break:break-all}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="app"><header class="top"><div class="title">Word Pronunciation Compare</div><div class="top-actions"><button id="clear" class="clear-btn" type="button">清空</button><button id="export" class="export-btn" type="button">导出🔗</button></div></header><main id="cards" class="cards"></main></div><div id="toast" class="toast"></div><script>const MAX_WORDS=20;const API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev';const IPA_API_BASE='https://freedictionaryapi.com/api/v1/entries/en/';const cards=document.getElementById('cards');const state=new Map();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}/g,'').replace(/\{b\}|\{\/b\}/g,'').replace(/\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}function play(url,btn){if(!url)return;const a=new Audio(url);if(btn)btn.disabled=true;a.play().catch(e=>console.warn('Audio playback failed',e)).finally(()=>{if(btn)btn.disabled=false})}function normalizeIPA(text){let s=String(text??'').trim();s=s.replace(/^\s*(?:IPA|phonetic|phonetic transcription)\s*[:：]\s*/i,'').trim();s=s.replace(/^\s*[\[\/]/,'').replace(/[\]\/) ]+$/,'').trim();s=s.replaceAll('ɛ','e').replaceAll('ɹ','r');return s}function getDefinitions(entry){const out=[];for(const d of (entry.def||[]))for(const seq of (d.sseq||[]))for(const group of seq||[]){if(!Array.isArray(group)||group[0]!=='sense')continue;const obj=group[1]||{};const texts=[];for(const dt of (obj.dt||[])){if(dt[0]==='text')texts.push(cleanMW(dt[1]));else if(dt[0]==='vis'&&Array.isArray(dt[1]))for(const v of dt[1])if(v&&v.t)texts.push('Example: '+cleanMW(v.t))}if(texts.length)out.push({text:texts[0],example:texts.find(x=>x.startsWith('Example:'))?.replace(/^Example:\s*/,'')});if(obj.sdsense?.dt){const t=obj.sdsense.dt.find(x=>x[0]==='text');if(t)out.push({text:cleanMW(t[1])})}}return out}function createSearchCard(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search word…"><button id="add" aria-label="Search">＋</button></div><div class="search-hint">可使用逗号或空格分隔进行批量查询</div>';cards.appendChild(el);const input=el.querySelector('#input');const add=el.querySelector('#add');const submit=()=>addWordsFromInput(input.value);add.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});const hint=document.createElement('div');hint.className='comparison-hint';hint.innerHTML='It can be used to display multiple similar words and also to compare and learn pronunciation <button type="button" class="comparison-example">Example</button>';cards.appendChild(hint);hint.querySelector('.comparison-example').onclick=()=>addWordsFromInput('dad dead')}function parseWords(raw){return raw.split(/[\s,，;；.。]+/).map(s=>s.trim()).filter(Boolean)}function buildPageUrl(words){const url=new URL(location.href);url.search='';if(words.length)url.searchParams.set('word_list',words.join(','));return url.toString()}function currentWords(){return Array.from(state.keys())}function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),5000)}async function exportLink(){const words=currentWords();if(!words.length){showToast('当前页面还没有单词。');return}const link=buildPageUrl(words);try{await navigator.clipboard.writeText(link)}catch(e){const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}finally{ta.remove()}}showToast('已保存当前页面的链接到剪贴板\n'+link)}document.getElementById('export').onclick=exportLink;document.getElementById('clear').onclick=()=>{if(!state.size)return;state.clear();cards.querySelectorAll('.card:not(.search-card)').forEach(el=>el.remove());showToast('已清空所有单词。')};function addWordsFromInput(raw){const words=[...new Set(parseWords(raw).map(w=>w.toLowerCase()))];if(!words.length)return;const input=document.getElementById('input');if(input)input.value='';const available=MAX_WORDS-state.size;const newWords=words.filter(word=>!state.has(word));if(newWords.length>available){showToast(`最多显示 ${MAX_WORDS} 个单词。当前已有 ${state.size} 个，本次最多还能添加 ${Math.max(available,0)} 个。`);return}const autoPlay=words.length===1;newWords.forEach(word=>addWord(word,autoPlay))}function addWord(raw,autoPlay=true){const word=raw.trim();if(!word||state.size>=MAX_WORDS)return;const key=word.toLowerCase();if(state.has(key)){document.getElementById('card-'+state.get(key)).scrollIntoView({behavior:'smooth',block:'center'});return}const id=Math.random().toString(36).slice(2);state.set(key,id);const searchCard=document.querySelector('.search-card');const el=document.createElement('section');el.className='card';el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline" data-pron></div><button class="expand">展开</button><button class="close" title="Remove">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;el.querySelector('.close').onclick=()=>{state.delete(key);el.remove()};el.querySelector('.expand').onclick=()=>{el.classList.toggle('open');el.querySelector('.expand').textContent=el.classList.contains('open')?'收起':'展开'};cards.insertBefore(el,searchCard);el.scrollIntoView({behavior:'smooth',block:'center'});fetchWord(word,el,autoPlay)}function isUsefulIPA(p){if(!p||!p.text)return false;const tags=(p.tags||[]).join(' ').toLowerCase();const type=String(p.type||'').toLowerCase();const text=String(p.text).trim();if(!text)return false;if(/audio|sound|rhymes?|homophone|hyphenation/.test(type+' '+tags))return false;return /[\u0250-\u02ff\u1d00-\u1d7f\u2000-\u206f]/.test(text)||/[ˈˌɪiːʊuːəɑæʌɔɛɒɜɝɚθðʃʒŋ]/.test(text)}function extractFirstFreeIPA(data){for(const entry of (data.entries||[]))for(const p of (entry.pronunciations||[]))if(isUsefulIPA(p)){const ipa=normalizeIPA(p.text);if(ipa)return ipa}return ''}function renderPronunciation(el,ipa,mwPrs){const pin=el.querySelector('[data-pron]');const firstAudioId=mwPrs.find(p=>p.sound?.audio)?.sound?.audio||'';const url=audioUrl(firstAudioId);const fallback=normalizeIPA(mwPrs.find(p=>p.mw)?.mw||'');const finalIPA=ipa||fallback;if(!finalIPA&&!url)return null;const delimited=/^[\[\/].*[\]\/]$/.test(finalIPA);pin.innerHTML=`<div class="pron">${url?`<button title="Play" data-audio="${esc(url)}"><span class="speaker"><span class="body"></span><span class="cone"></span><span class="wave1"></span><span class="wave2"></span><span class="wave3"></span></span></button>`:''}<span class="ipa ${delimited?'already-delimited':''}">${esc(finalIPA)}</span><span class="accent">US</span></div>`;const btn=pin.querySelector('[data-audio]');if(btn)btn.onclick=()=>play(btn.dataset.audio,btn);return url}async function fetchWord(word,el,autoPlay=true){try{const [mwResponse,ipaResponse]=await Promise.all([fetch(API_BASE+'/lookup?word='+encodeURIComponent(word)),fetch(IPA_API_BASE+encodeURIComponent(word))]);let data;try{data=await mwResponse.json()}catch{throw new Error('Merriam-Webster API returned an invalid response')}if(!mwResponse.ok)throw new Error(data.error||('Merriam-Webster HTTP '+mwResponse.status));const entry=data.entries?.[0];if(!entry)throw new Error('No dictionary entry returned');let ipa='';if(ipaResponse.ok){try{ipa=extractFirstFreeIPA(await ipaResponse.json())}catch(e){console.warn('FreeDictionaryAPI returned invalid data',e)}}const mwPrs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw||p.ipa);const firstAudio=renderPronunciation(el,ipa,mwPrs);const short=(entry.shortdef||[]).slice(0,1);let summary=short.length?cleanMW(short[0]):'';const defs=getDefinitions(entry);if(!summary&&defs.length)summary=defs[0].text;el.querySelector('.brief').textContent=summary||'No short definition returned.';let details='';if(defs.length){details+=`<div class="pos">${esc(entry.fl||'definition')}</div><ol class="defs">`;defs.slice(0,12).forEach(d=>{details+=`<li>${esc(d.text)}${d.example?`<div class="example">Example: ${esc(d.example)}</div>`:''}</li>`});details+='</ol>'}else if(summary)details=`<div class="pos">${esc(entry.fl||'definition')}</div><div class="brief">${esc(summary)}</div>`;details+=`<div class="mw">Source: Merriam-Webster + FreeDictionaryAPI</div>`;el.querySelector('.details').innerHTML=details;if(autoPlay&&firstAudio){const auto=new Audio(firstAudio);auto.preload='auto';auto.play().catch(e=>console.warn('Automatic first pronunciation was blocked by browser policy',e))}}catch(e){el.querySelector('.brief').outerHTML=`<div class="error">${esc(e.message)}</div>`}}function loadWordsFromUrl(){const params=new URLSearchParams(location.search);const raw=params.get('word_list');if(!raw)return;const words=[...new Set(parseWords(raw).map(w=>w.toLowerCase()))];if(words.length>MAX_WORDS){showToast(`链接中包含 ${words.length} 个单词，最多显示 ${MAX_WORDS} 个。`)}words.slice(0,MAX_WORDS).forEach(word=>addWord(word,false))}createSearchCard();loadWordsFromUrl();</script></body></html>
