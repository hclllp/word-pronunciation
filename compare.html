<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:0 12px 24px}.top{position:sticky;top:0;z-index:100;margin:0 -12px 6px;padding:10px 12px 7px;display:flex;align-items:center;justify-content:space-between;background:rgba(245,246,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #e1e5e9}.title{font-size:22px;font-weight:780}.top-actions{display:flex;gap:5px}.export-btn,.clear-btn{border:0;border-radius:7px;color:#fff;padding:5px 9px;font-size:13px}.export-btn{background:#59616b}.clear-btn{background:#d64545}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:box-shadow .16s ease,transform .16s ease}.card.open .brief{white-space:normal;overflow:visible;text-overflow:clip}.card.dragging{position:fixed!important;margin:0!important;z-index:1000!important;pointer-events:none!important;box-shadow:0 18px 45px #0004!important;transform:none!important;transition:none!important}.card.dragging *{pointer-events:none}.drag-placeholder{border:1px dashed #aeb7c0;background:#e9edf0;border-radius:10px;opacity:.75;pointer-events:none}.head{display:flex;align-items:center;gap:5px;min-height:28px}.word{font-size:20px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:4px;margin-left:3px;flex-wrap:wrap}.pron{display:flex;align-items:center;gap:4px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:17px}.ipa{font-size:14px;white-space:nowrap}.ipa::before,.ipa::after{content:'/';color:#68717c}.accent{font-size:9px;color:#68717c;font-weight:750}.close,.download{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:5px 7px;font-size:13px}.close{font-size:18px;padding:1px 6px}.download{margin-left:auto}.download:disabled{opacity:.5}.summary{padding-top:1px}.brief{font-size:13px;color:#414952;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}.details{display:none;margin-top:5px;border-top:1px solid #edf0f2;padding-top:5px}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;margin:4px 0 2px}.defs{margin:0;padding-left:17px}.defs li{margin:3px 0;line-height:1.35;font-size:13px}.example{font-size:12px;color:#747d87}.loading{font-size:13px;color:#747d87}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px}.mw{font-size:10px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none;cursor:default;touch-action:auto}.search-row{display:flex;gap:5px;position:relative}.search-row input{flex:1;border:0;outline:none;background:transparent;font-size:17px;padding:3px;transition:opacity .18s ease}.search-row input.hint-fade{opacity:.25}.search-hint.hint-fade{opacity:.25}.search-row button{width:34px;height:30px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:19px}.search-hint,.comparison-hint{font-size:11px;color:#8a929b}.search-hint{padding-top:3px}.comparison-hint{text-align:center;margin:5px 2px 0;line-height:1.3}.comparison-example{font-size:11px;color:#6fa8dc;border:0;background:none}.speaker{display:inline-block;width:20px;height:20px;position:relative;color:#27303a}.speaker span{position:absolute;border-color:currentColor}.speaker .body{left:1px;top:7px;width:5px;height:8px;background:currentColor}.speaker .cone{left:5px;top:4px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}.speaker .wave1,.speaker .wave2,.speaker .wave3{border:1.7px solid currentColor;border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 50% 50% 0}.speaker .wave1{left:11px;top:6px;width:5px;height:9px}.speaker .wave2{left:12px;top:3px;width:7px;height:14px}.speaker .wave3{left:13px;top:1px;width:9px;height:18px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);width:min(92vw,620px);background:#202632;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.4;opacity:0;pointer-events:none;transition:.18s;z-index:1100}.toast.show{opacity:1;transform:translate(-50%,0)}body.reordering{cursor:grabbing;overflow:hidden}body.reordering .top{pointer-events:none}.audio-debug{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,720px);max-height:82vh;overflow:auto;background:#202632;color:#fff;border-radius:12px;padding:14px;z-index:1200;box-shadow:0 20px 60px #0007;font-size:11px;line-height:1.45}.audio-debug-title{font-size:14px;font-weight:700;margin-bottom:8px}.audio-debug-close{float:right;border:0;border-radius:6px;background:#eef0f2;color:#202632;padding:4px 8px}.audio-debug-log{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;margin:0;white-space:pre-wrap;word-break:break-word}.version{margin:10px 0 2px;text-align:center;font-size:9px;color:#c4c9ce;line-height:1;user-select:none;-webkit-user-select:none}

<body>
<div class="app"><header class="top"><div class="title">Word Pronunciation Compare</div><div class="top-actions"><button id="clear" class="clear-btn">清空</button><button id="export" class="export-btn">导出🔗</button></div></header><main id="cards" class="cards"></main><div class="version">3.0.3</div></div><div id="toast" class="toast"></div><div id="audio-debug" class="audio-debug" hidden><button class="audio-debug-close" onclick="document.getElementById('audio-debug').hidden=true">关闭</button><div class="audio-debug-title">音频处理诊断</div><pre class="audio-debug-log"></pre></div>
<script>
const MAX_WORDS=50,MIN_DOWNLOAD_DURATION=1.1,API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev',IPA_API_BASE='https://freedictionaryapi.com/api/v1/entries/en/';
const SEARCH_HINTS=['不知道怎么用，可以点点下方的example','可同时输入多个单词进行一键批量查询','长按卡片可以上下拖动调整位置','单击卡片展开详情介绍'];
const cards=document.getElementById('cards'),state=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}|\{b\}|\{\/b\}|\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}
function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return`https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}
function play(url,b){if(!url)return;const a=new Audio(url);if(b)b.disabled=true;a.play().catch(console.warn).finally(()=>{if(b)b.disabled=false})}
function normalizeIPA(s){s=String(s??'').trim().replace(/^\s*(?:IPA|phonetic|phonetic transcription)\s*[:：]\s*/i,'').replace(/^\s*[\[\/]/,'').replace(/[\]\/) ]+$/,'').trim();return s.replaceAll('ɛ','e').replaceAll('ɹ','r')}
function isIPA(p){const t=String(p?.text||'');return t&&!/audio|sound|rhymes?|homophone|hyphenation/i.test(String(p?.type||'')+' '+String(p?.tags||''))&&(/[\u0250-\u02ff\u1d00-\u1d7f]/.test(t)||/[ˈˌɪiːʊuːəɑæʌɔɛɒɜɝɚθðʃʒŋ]/.test(t))}
function firstIPA(d){for(const e of d.entries||[])for(const p of e.pronunciations||[])if(isIPA(p)){const x=normalizeIPA(p.text);if(x)return x}return''}
function defs(entry){const out=[];for(const d of entry.def||[])for(const seq of d.sseq||[])for(const g of seq||[]){if(!Array.isArray(g)||g[0]!=='sense')continue;const o=g[1]||{},ts=[];for(const x of o.dt||[]){if(x[0]==='text')ts.push(cleanMW(x[1]));else if(x[0]==='vis')for(const v of x[1]||[])if(v?.t)ts.push('Example: '+cleanMW(v.t))}if(ts.length)out.push({text:ts[0],example:ts.find(x=>x.startsWith('Example:'))?.slice(9)});if(o.sdsense?.dt){const x=o.sdsense.dt.find(x=>x[0]==='text');if(x)out.push({text:cleanMW(x[1])})}}if(!out.length&&Array.isArray(entry.shortdef))for(const x of entry.shortdef){const text=cleanMW(x);if(text)out.push({text})}return out}
function writeWav(b){const c=b.numberOfChannels,r=b.sampleRate,n=b.length,ab=new ArrayBuffer(44+n*c*2),v=new DataView(ab);const w=(p,s)=>[...s].forEach((x,i)=>v.setUint8(p+i,x.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+n*c*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,c,true);v.setUint32(24,r,true);v.setUint32(28,r*c*2,true);v.setUint16(32,c*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*c*2,true);let p=44,ch=Array.from({length:c},(_,i)=>b.getChannelData(i));for(let i=0;i<n;i++)for(let j=0;j<c;j++){let x=Math.max(-1,Math.min(1,ch[j][i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
function audioDiag(word,logs){const box=document.getElementById('audio-debug'),pre=box.querySelector('.audio-debug-log');pre.textContent=`单词：${word}\n时间：${new Date().toISOString()}\n浏览器：${navigator.userAgent}\n\n`+logs.join('\n');box.hidden=false;showToast(`音频处理失败：${logs[logs.length-1]||'未知错误'}\n请查看诊断窗口`)}
async function fetchBytes(url,stage,logs){logs.push(`[${stage}] URL\n${url}`);try{const r=await fetch(url,{mode:'cors',cache:'no-store'});const ct=r.headers.get('content-type')||'(无 Content-Type)';logs.push(`[${stage}] HTTP ${r.status} ${r.statusText}\nContent-Type: ${ct}`);if(!r.ok)throw Error(`HTTP ${r.status}`);const bytes=await r.arrayBuffer();logs.push(`[${stage}] 数据大小：${bytes.byteLength} bytes`);if(!bytes.byteLength)throw Error('音频数据为空');return bytes}catch(e){logs.push(`[${stage}] FETCH ERROR：${e?.name||'Error'} / ${e?.message||e}`);throw e}}
async function decodeBytes(bytes,stage,logs){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const b=await ctx.decodeAudioData(bytes.slice(0));logs.push(`[${stage}] decodeAudioData：成功，${b.numberOfChannels} 声道，${b.sampleRate} Hz，${b.duration.toFixed(4)} s`);try{await ctx.close()}catch{}return b}catch(e){logs.push(`[${stage}] decodeAudioData：失败，${e?.name||'Error'} / ${e?.message||e}`);throw e}}
function downloadBlob(blob,word){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${word}.wav`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function downloadAudio(url,word,btn,el){const old=btn.textContent;btn.textContent='处理中…';const logs=[];try{if(!url)throw Error('没有可用的音频');const wavUrl=url.replace('/mp3/','/wav/').replace(/\.mp3$/i,'.wav');logs.push(`[开始] MP3 URL：${url}`);logs.push(`[策略] 优先取得 Merriam-Webster WAV：${wavUrl}`);try{const wb=await fetchBytes(wavUrl,'MW WAV',logs);if(wb.length>=44&&new TextDecoder().decode(wb.slice(0,4))==='RIFF'&&new TextDecoder().decode(wb.slice(8,12))==='WAVE'){logs.push('[MW WAV] RIFF/WAVE 格式有效，直接作为 WAV 下载（避免浏览器解码 MP3）');downloadBlob(new Blob([wb],{type:'audio/wav'}),word);return}else logs.push('[MW WAV] 不是标准 RIFF/WAVE，转入 MP3 路径')}catch(e){logs.push(`[MW WAV] 失败：${e?.name||'Error'} / ${e?.message||e}`)}const mb=await fetchBytes(url,'MP3',logs);let b;try{b=await decodeBytes(mb,'MP3',logs)}catch(e){logs.push('[MP3] 标准解码失败；记录 HTMLAudio 媒体错误后停止，避免生成损坏文件');const blobUrl=URL.createObjectURL(new Blob([mb],{type:'audio/mpeg'})),audio=new Audio();audio.preload='auto';audio.src=blobUrl;audio.onloadedmetadata=()=>logs.push(`[HTMLAudio] metadata：duration=${Number.isFinite(audio.duration)?audio.duration.toFixed(4):'NaN'} readyState=${audio.readyState} networkState=${audio.networkState}`);await new Promise((resolve,reject)=>{audio.onloadeddata=resolve;audio.onerror=()=>{const er=audio.error;logs.push(`[HTMLAudio] ERROR：code=${er?.code??'null'} message=${er?.message||'无'} readyState=${audio.readyState} networkState=${audio.networkState}`);reject(Error('Load failed'))};audio.load()});throw e}if(b.duration<MIN_DOWNLOAD_DURATION){const frames=Math.ceil(b.sampleRate*MIN_DOWNLOAD_DURATION),ctx=new OfflineAudioContext(b.numberOfChannels,frames,b.sampleRate),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start();b=await ctx.startRendering();logs.push('[补齐] MP3 PCM 已补至 1.1000 s')}downloadBlob(writeWav(b),word)}catch(e){logs.push(`[最终失败] ${e?.name||'Error'} / ${e?.message||e}`);console.error('Audio download failed:',e,logs);audioDiag(word,logs)}finally{btn.textContent=old}}
function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),5000)}
function parseWords(s){return s.split(/[\s,，;；.。]+/).map(x=>x.trim()).filter(Boolean)}
function currentWords(){return [...cards.querySelectorAll('.card[data-word]')].map(x=>x.dataset.word)}
function pageUrl(ws){const u=new URL(location.href);u.search='';if(ws.length)u.searchParams.set('word_list',ws.join(','));return u.toString()}
async function exportLink(){const ws=currentWords();if(!ws.length)return showToast('当前页面还没有单词。');const u=pageUrl(ws);try{await navigator.clipboard.writeText(u)}catch{const x=document.createElement('textarea');x.value=u;document.body.append(x);x.select();document.execCommand('copy');x.remove()}showToast('已保存当前页面的链接到剪贴板\n'+u)}
document.getElementById('export').onclick=exportLink;document.getElementById('clear').onclick=()=>{state.clear();cards.querySelectorAll('.card[data-word]').forEach(x=>x.remove());showToast('已清空所有单词。')};
function createSearch(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" placeholder="Search word ..." autocomplete="off" autocapitalize="none"><button id="add">＋</button></div><div class="search-hint">不知道怎么用，可以点点下方的example</div>';cards.append(el);const input=el.querySelector('#input'),hint=el.querySelector('.search-hint'),submit=()=>addWords(input.value);el.querySelector('#add').onclick=submit;input.onkeydown=e=>{if(e.key==='Enter')submit()};let hi=0;setInterval(()=>{if(document.activeElement===input||input.value)return;hint.classList.add('hint-fade');setTimeout(()=>{hi=(hi+1)%SEARCH_HINTS.length;hint.textContent=SEARCH_HINTS[hi];hint.classList.remove('hint-fade')},180)},5000);const h=document.createElement('div');h.className='comparison-hint';h.innerHTML='It can be used to display multiple similar words and also to compare and learn pronunciation <button class="comparison-example">Example</button>';cards.append(h);h.querySelector('button').onclick=()=>addWords('dad dead')}
function addWords(raw){raw=String(raw||'').trim();if(raw.toLowerCase()==='$setting'){location.href='stats.html';return}const ws=[...new Set(parseWords(raw).map(x=>x.toLowerCase()))],nw=ws.filter(x=>!state.has(x));if(!nw.length)return;if(state.size+nw.length>MAX_WORDS)return showToast(`最多显示 ${MAX_WORDS} 个单词。`);document.getElementById('input').value='';const auto=ws.length===1;nw.forEach(w=>addWord(w,auto))}
function addWord(word,auto){const id=Math.random().toString(36).slice(2),search=document.querySelector('.search-card'),el=document.createElement('section');state.set(word,id);el.className='card';el.dataset.word=word;el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline"></div><button class="download" disabled>下载</button><button class="close">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;cards.insertBefore(el,search);el.querySelector('.close').onclick=e=>{e.stopPropagation();state.delete(word);el.remove()};el.querySelector('.download').onclick=e=>{e.stopPropagation();downloadAudio(el._audio?.url,word,e.currentTarget,el)};setupDrag(el);el.onclick=e=>{if(e.target.closest('button')||el._dragHandled)return;if(el._clickBlocked){el._clickBlocked=false;return}el.classList.toggle('open')};fetchWord(word,el,auto)}
async function fetchWord(word,el,auto){try{const[mw,ip]=await Promise.all([fetch(API_BASE+'/lookup?word='+encodeURIComponent(word),{cache:'no-store'}),fetch(IPA_API_BASE+encodeURIComponent(word),{cache:'no-store'})]);const d=await mw.json();if(!mw.ok)throw Error(d.error||'Merriam-Webster error');const entry=d.entries?.[0];if(!entry)throw Error('No dictionary entry returned');let ipa='';if(ip.ok)try{ipa=firstIPA(await ip.json())}catch{}const prs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw),aid=prs.find(p=>p.sound?.audio)?.sound?.audio,url=audioUrl(aid),final=ipa||normalizeIPA(prs.find(p=>p.mw)?.mw||'');const pin=el.querySelector('.pron-inline');if(url||final)pin.innerHTML=`${url?`<button data-play title="播放"><span class="speaker"><span class="body"></span><span class="cone"></span><span class="wave1"></span><span class="wave2"></span><span class="wave3"></span></span></button>`:''}${final?`<span class="pron"><span class="ipa">${esc(final)}</span></span>`:''}`;const p=pin.querySelector('[data-play]');if(p)p.onclick=e=>{e.stopPropagation();play(url,p)};const ds=defs(entry),brief=el.querySelector('.brief'),details=el.querySelector('.details');brief.textContent=ds[0]?.text||'No definition available.';details.innerHTML=ds.map(x=>`<div class="pos">${esc(entry.fl||'')}</div><ul class="defs"><li>${esc(x.text)}</li></ul>${x.example?`<div class="example">${esc(x.example)}</div>`:''}`).join('')+`<div class="mw">Merriam-Webster</div>`;if(url)el._audio={url};const db=el.querySelector('.download');db.disabled=!url;if(auto&&url)play(url,p)}catch(e){el.querySelector('.brief').innerHTML=`<div class="error">${esc(e.message||'查询失败')}</div>`}}
function setupDrag(el){let timer=null,active=false,moved=false,pressed=false,pid=null,startX=0,startY=0,lastX=0,lastY=0,offsetX=0,offsetY=0,lastScrollY=window.scrollY,placeholder=null;
const blocked=t=>!!t.closest('button,input,.search-card');
const log=(event,data={})=>console.debug('[touch-drag]',event,{word:el.dataset.word,...data});
const cancelTimer=()=>{if(timer){clearTimeout(timer);timer=null}};
const cleanup=(reason)=>{cancelTimer();if(pid!==null&&el.hasPointerCapture?.(pid))try{el.releasePointerCapture(pid)}catch{};document.body.classList.remove('reordering');el.classList.remove('dragging');el.style.position='';el.style.left='';el.style.top='';el.style.width='';el.style.height='';el.style.zIndex='';el.style.pointerEvents='';if(placeholder){placeholder.replaceWith(el);placeholder=null}active=false;pressed=false;el._dragHandled=true;el._clickBlocked=true;log('END',{reason,scrollY:window.scrollY});setTimeout(()=>{el._dragHandled=false;el._clickBlocked=false},0)};
const movePlaceholder=y=>{const items=[...cards.querySelectorAll('.card[data-word]')].filter(x=>x!==el);let target=null;for(const item of items){const r=item.getBoundingClientRect();if(y<r.top+r.height/2){target=item;break}}if(target){if(placeholder.nextElementSibling!==target)cards.insertBefore(placeholder,target)}else{const search=cards.querySelector('.search-card');if(search&&placeholder.nextElementSibling!==search)cards.insertBefore(placeholder,search)}};
const begin=()=>{if(!pressed||active)return;active=true;el._dragHandled=true;document.body.classList.add('reordering');const r=el.getBoundingClientRect();offsetX=lastX-r.left;offsetY=lastY-r.top;placeholder=document.createElement('div');placeholder.className='drag-placeholder';placeholder.style.height=r.height+'px';placeholder.style.width=r.width+'px';cards.insertBefore(placeholder,el);el.classList.add('dragging');el.style.position='fixed';el.style.left=(lastX-offsetX)+'px';el.style.top=(lastY-offsetY)+'px';el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.zIndex='1000';el.style.pointerEvents='none';lastScrollY=window.scrollY;if(pid!==null&&el.setPointerCapture)try{el.setPointerCapture(pid)}catch{}movePlaceholder(lastY);log('START',{x:lastX,y:lastY,scrollY:window.scrollY,cardHeight:r.height})};
const down=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(blocked(e.target)||active)return;pid=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;pressed=true;el._clickBlocked=false;lastScrollY=window.scrollY;cancelTimer();log('DOWN',{x:startX,y:startY,scrollY:lastScrollY,pointerType:e.pointerType});timer=setTimeout(begin,500)};
const move=e=>{if(pid!==e.pointerId)return;const x=e.clientX,y=e.clientY,dx=x-startX,dy=y-startY;lastX=x;lastY=y;if(!active){if(Math.hypot(dx,dy)>8){moved=true;pressed=false;cancelTimer();const sy=lastScrollY;window.scrollTo({top:Math.max(0,sy-dy),behavior:'auto'});lastScrollY=window.scrollY;log('SCROLL_FALLBACK',{x,y,dy,scrollY:window.scrollY})}return}e.preventDefault();e.stopPropagation();el.style.left=(x-offsetX)+'px';el.style.top=(y-offsetY)+'px';movePlaceholder(y);const edge=55;if(y<edge)window.scrollBy(0,-12);else if(y>innerHeight-edge)window.scrollBy(0,12);log('MOVE',{x,y,dx,dy,scrollY:window.scrollY,target:document.elementFromPoint(x,y)?.className||document.elementFromPoint(x,y)?.tagName||null})};
const up=e=>{if(pid!==e.pointerId)return;cancelTimer();if(active)cleanup('pointerup');else if(moved){el._clickBlocked=true;setTimeout(()=>el._clickBlocked=false,0)}pressed=false;pid=null};
const abort=e=>{if(pid!==e.pointerId)return;cancelTimer();log('ABORT',{reason:e.type,scrollY:window.scrollY});if(active)cleanup(e.type);pressed=false;pid=null};
el.addEventListener('pointerdown',down,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',up,{passive:false});document.addEventListener('pointercancel',abort,{passive:false});
}
