<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Pronunciation Compare</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:16px 14px 50px}.top{position:sticky;top:0;z-index:5;background:#f5f6f8ee;backdrop-filter:blur(12px);padding:3px 0 12px}.title{font-size:25px;font-weight:780;margin:4px 0}.subtitle{font-size:12px;color:#707983;margin-bottom:10px}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;min-width:0;border:1px solid #d5dbe0;border-radius:11px;background:#fff;padding:11px 13px;font-size:16px;outline:none}.toolbar button{min-width:46px;border:0;border-radius:11px;background:#202632;color:#fff;font-size:21px;font-weight:700}.cards{display:flex;flex-direction:column;gap:9px;margin-top:10px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:13px;padding:11px 12px;box-shadow:0 2px 10px #00000007}.head{display:flex;align-items:center;gap:8px}.word{font-size:21px;font-weight:760;flex:1;overflow-wrap:anywhere}.close,.expand{border:0;border-radius:9px;background:#eef0f2;color:#59616b;padding:7px 9px;font-size:13px}.close{font-size:18px;padding:4px 8px}.summary{margin-top:7px}.phonetics{display:flex;flex-wrap:wrap;gap:6px}.pron{display:flex;align-items:center;gap:5px;border:1px solid #e0e4e8;border-radius:9px;padding:5px 7px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:16px;cursor:pointer}.ipa{font-size:14px}.accent{font-size:10px;color:#68717c;font-weight:750;text-transform:uppercase}.brief{font-size:13px;color:#414952;line-height:1.4;margin-top:7px}.details{display:none;margin-top:10px;border-top:1px solid #edf0f2;padding-top:9px}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin:9px 0 4px}.defs{margin:0;padding-left:19px}.defs li{margin:6px 0;line-height:1.4;font-size:13px}.example{font-size:12px;color:#747d87;margin-top:3px}.loading{font-size:13px;color:#747d87;padding:4px 0}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:9px;padding:8px;margin-top:8px}.empty{text-align:center;padding:30px 15px;color:#7a828c;font-size:13px}.mw{font-size:10px;color:#8a929b;margin-top:10px}.hint{font-size:11px;color:#7a828c;margin-top:7px}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="title">Word Pronunciation Compare</div>
<div class="subtitle">Keep multiple words open and compare their pronunciation and meanings.</div>
<div class="toolbar"><input id="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Enter an English word…"><button id="add" aria-label="Add word">＋</button></div>
</header>
<main id="cards" class="cards"></main>
</div>
<script>
// Set this after deploying api/wrangler.toml. Example:
// https://word-pronunciation-api.<your-account-subdomain>.workers.dev
const API_BASE=localStorage.getItem('wordPronunciationApiBase')||'YOUR_WORKER_URL';
const input=document.getElementById('input'),add=document.getElementById('add'),cards=document.getElementById('cards');
const state=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}/g,'').replace(/\{b\}|\{\/b\}/g,'').replace(/\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}
function audioUrl(id){if(!id)return null;const sub=/^(bix)/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_\-]/.test(id)?'number':id[0].toLowerCase();return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}
function play(url,btn){if(!url)return;const a=new Audio(url);if(btn)btn.disabled=true;a.play().catch(e=>{console.warn(e);window.open(url,'_blank')}).finally(()=>{if(btn)btn.disabled=false})}
function getDefinitions(entry){const out=[];for(const d of (entry.def||[])){for(const seq of (d.sseq||[])){for(const group of seq||[]){if(!Array.isArray(group)||group[0]!=='sense')continue;const obj=group[1]||{};const texts=[];for(const dt of (obj.dt||[])){if(dt[0]==='text')texts.push(cleanMW(dt[1]));else if(dt[0]==='vis'&&Array.isArray(dt[1])){for(const v of dt[1])if(v&&v.t)texts.push('Example: '+cleanMW(v.t))} }if(texts.length)out.push({text:texts[0],example:texts.find(x=>x.startsWith('Example:'))?.replace(/^Example:\s*/,'')});if(obj.sdsense&&obj.sdsense.dt){const t=obj.sdsense.dt.find(x=>x[0]==='text');if(t)out.push({text:cleanMW(t[1])})}}}}return out}
function renderEmpty(){if(!cards.children.length)cards.innerHTML='<div class="empty">Search a word to create the first comparison card.</div>'}
function addWord(raw){const word=raw.trim();if(!word)return;const key=word.toLowerCase();input.value='';if(state.has(key)){document.getElementById('card-'+state.get(key)).scrollIntoView({behavior:'smooth',block:'center'});return}const id=Math.random().toString(36).slice(2);state.set(key,id);if(!cards.children.length)cards.innerHTML='';const el=document.createElement('section');el.className='card';el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><button class="expand">展开</button><button class="close" title="Remove">×</button></div><div class="loading">Searching…</div>`;el.querySelector('.close').onclick=()=>{state.delete(key);el.remove();renderEmpty()};el.querySelector('.expand').onclick=()=>{el.classList.toggle('open');el.querySelector('.expand').textContent=el.classList.contains('open')?'收起':'展开'};cards.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'center'});fetchWord(word,el)}
async function fetchWord(word,el){try{if(API_BASE==='YOUR_WORKER_URL')throw new Error('API not configured. Set localStorage wordPronunciationApiBase to your deployed Worker URL.');const r=await fetch(API_BASE.replace(/\/$/,'')+'/lookup?word='+encodeURIComponent(word));const data=await r.json();if(!r.ok)throw new Error(data.error||('HTTP '+r.status));const entry=data.entries[0];const prs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw||p.ipa);let summary='';const short=(entry.shortdef||[]).slice(0,1);if(short.length)summary=cleanMW(short[0]);else{const defs=getDefinitions(entry);if(defs.length)summary=defs[0].text}let html='<div class="summary"><div class="phonetics">';if(!prs.length)html+='<span class="loading">No audio returned.</span>';prs.forEach(p=>{const id=p.sound?.audio;const url=audioUrl(id);const ipa=p.ipa||p.mw||'';html+=`<div class="pron">${url?`<button title="Play" data-audio="${esc(url)}">▶</button>`:''}<span class="ipa">${esc(ipa)}</span><span class="accent">US</span></div>`});html+='</div>';if(summary)html+=`<div class="brief">${esc(summary)}</div>`;html+='</div><div class="details">';const defs=getDefinitions(entry);const grouped=new Map();if(entry.fl)grouped.set(entry.fl,defs);if(!defs.length&&summary)grouped.set(entry.fl||'definition',[{text:summary}]);for(const [pos,items] of grouped){html+=`<div class="pos">${esc(pos)}</div><ol class="defs">`;items.slice(0,12).forEach(d=>{html+=`<li>${esc(d.text)}${d.example?`<div class="example">Example: ${esc(d.example)}</div>`:''}</li>`});html+='</ol>'}html+=`<div class="mw">Source: Merriam-Webster ${data.source==='school'?'School Dictionary':'Collegiate Dictionary'}</div></div>`;el.querySelector('.loading').outerHTML=html;el.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>play(b.dataset.audio,b))}catch(e){el.querySelector('.loading').outerHTML=`<div class="error">${esc(e.message)}</div>`}}
add.onclick=()=>addWord(input.value);input.addEventListener('keydown',e=>{if(e.key==='Enter')addWord(input.value)});renderEmpty();
</script>
</body>
</html>
