<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Word Pronunciation Compare</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:10px 12px 24px}.top{padding:0 0 5px;display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:22px;font-weight:780;margin:2px 0}.export-btn{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:5px 9px;font-size:13px;white-space:nowrap}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006}.head{display:flex;align-items:center;gap:5px;min-height:28px}.word{font-size:20px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:4px;margin-left:3px}.pron{display:flex;align-items:center;gap:4px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:17px;cursor:pointer}.pron button:disabled{opacity:.5}.ipa{font-size:14px;white-space:nowrap}.ipa::before,.ipa::after{content:'/';color:#68717c}.accent{font-size:9px;color:#68717c;font-weight:750;text-transform:uppercase}.close,.expand{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:5px 7px;font-size:13px}.close{font-size:18px;padding:1px 6px}.expand{margin-left:auto}.summary{padding-top:1px}.brief{font-size:13px;color:#414952;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}.details{display:none;margin-top:5px;border-top:1px solid #edf0f2;padding-top:5px}.card.open .details{display:block}.pos{font-size:11px;color:#68717c;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}.defs{margin:0;padding-left:17px}.defs li{margin:3px 0;line-height:1.35;font-size:13px}.example{font-size:12px;color:#747d87;margin-top:1px}.loading{font-size:13px;color:#747d87;padding:2px 0}.error{font-size:12px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px;margin-top:3px}.mw{font-size:10px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none}.search-row{display:flex;gap:5px}.search-row input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:17px;padding:3px 1px}.search-row button{width:34px;height:30px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:19px;font-weight:700}.speaker{display:inline-block;width:20px;height:20px;position:relative;color:#27303a}.speaker .body{position:absolute;left:1px;top:7px;width:5px;height:8px;border-radius:1px;background:currentColor}.speaker .cone{position:absolute;left:5px;top:4px;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:8px solid currentColor}.speaker .wave1,.speaker .wave2,.speaker .wave3{position:absolute;border:1.7px solid currentColor;border-left:0;border-top-color:transparent;border-bottom-color:transparent;border-radius:0 50% 50% 0}.speaker .wave1{left:11px;top:6px;width:5px;height:9px}.speaker .wave2{left:12px;top:3px;width:7px;height:14px}.speaker .wave3{left:13px;top:1px;width:9px;height:18px}.comparison-hint{font-size:11px;color:#8a929b;text-align:center;margin:5px 2px 0;line-height:1.3}.comparison-example{font-size:11px;color:#6fa8dc;margin-left:5px;text-decoration:none;cursor:pointer;white-space:nowrap}.comparison-example:hover{text-decoration:underline}</style></head><body><div class="app"><header class="top"><div class="title">Word Pronunciation Compare</div><button id="export" class="export-btn" type="button">导出🔗</button></header><main id="cards" class="cards"></main></div><script>const API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev';const cards=document.getElementById('cards');const state=new Map();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}/g,'').replace(/\{b\}|\{\/b\}/g,'').replace(/\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}function play(url,btn){if(!url)return;const a=new Audio(url);if(btn)btn.disabled=true;a.play().catch(e=>console.warn('Audio playback failed',e)).finally(()=>{if(btn)btn.disabled=false})}function getDefinitions(entry){const out=[];for(const d of (entry.def||[]))for(const seq of (d.sseq||[]))for(const group of seq||[]){if(!Array.isArray(group)||group[0]!=='sense')continue;const obj=group[1]||{};const texts=[];for(const dt of (obj.dt||[])){if(dt[0]==='text')texts.push(cleanMW(dt[1]));else if(dt[0]==='vis'&&Array.isArray(dt[1]))for(const v of dt[1])if(v&&v.t)texts.push('Example: '+cleanMW(v.t))}if(texts.length)out.push({text:texts[0],example:texts.find(x=>x.startsWith('Example:'))?.replace(/^Example:\s*/,'')});if(obj.sdsense?.dt){const t=obj.sdsense.dt.find(x=>x[0]==='text');if(t)out.push({text:cleanMW(t[1])})}}return out}function createSearchCard(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search word…"><button id="add" aria-label="Search">＋</button></div>';cards.appendChild(el);const input=el.querySelector('#input');const add=el.querySelector('#add');const submit=()=>addWordsFromInput(input.value,true);add.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});const hint=document.createElement('div');hint.className='comparison-hint';hint.innerHTML='It can be used to display multiple similar words and also to compare and learn pronunciation <button type="button" class="comparison-example">Example</button>';cards.appendChild(hint);hint.querySelector('.comparison-example').onclick=()=>{addWord('dad',true);addWord('dead',true)}}function parseWords(raw){return raw.split(/[\s,，;；.。]+/).map(s=>s.trim()).filter(Boolean)}function buildPageUrl(words){const url=new URL(location.href);url.search='';if(words.length)url.searchParams.set('word_list',words.join(','));return url.toString()}function currentWords(){return Array.from(state.keys())}async function exportLink(){const words=currentWords();if(!words.length){alert('There are no words to export yet.');return}const link=buildPageUrl(words);try{await navigator.clipboard.writeText(link);const btn=document.getElementById('export');const old=btn.textContent;btn.textContent='已复制🔗';setTimeout(()=>btn.textContent=old,1200)}catch(e){const ta=document.createElement('textarea');ta.value=link;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}finally{ta.remove()}const btn=document.getElementById('export');const old=btn.textContent;btn.textContent='已复制🔗';setTimeout(()=>btn.textContent=old,1200)}}document.getElementById('export').onclick=exportLink;function addWordsFromInput(raw,autoPlay=true){const words=parseWords(raw);if(!words.length)return;const input=document.getElementById('input');if(input)input.value='';words.forEach(word=>addWord(word,autoPlay))}function addWord(raw,autoPlay=true){const word=raw.trim();if(!word)return;const key=word.toLowerCase();if(state.has(key)){document.getElementById('card-'+state.get(key)).scrollIntoView({behavior:'smooth',block:'center'});return}const id=Math.random().toString(36).slice(2);state.set(key,id);const searchCard=document.querySelector('.search-card');const el=document.createElement('section');el.className='card';el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline" data-pron></div><button class="expand">展开</button><button class="close" title="Remove">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;el.querySelector('.close').onclick=()=>{state.delete(key);el.remove()};el.querySelector('.expand').onclick=()=>{el.classList.toggle('open');el.querySelector('.expand').textContent=el.classList.contains('open')?'收起':'展开'};cards.insertBefore(el,searchCard);el.scrollIntoView({behavior:'smooth',block:'center'});fetchWord(word,el,autoPlay)}async function fetchWord(word,el,autoPlay=true){try{const r=await fetch(API_BASE+'/lookup?word='+encodeURIComponent(word));let data;try{data=await r.json()}catch{throw new Error('API returned an invalid response')}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));const entry=data.entries?.[0];if(!entry)throw new Error('No dictionary entry returned');const prs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw||p.ipa);const pin=el.querySelector('[data-pron]');let firstAudio=null;prs.forEach((p,index)=>{const id=p.sound?.audio,url=audioUrl(id),ipa=p.ipa||p.mw||'';if(index===0&&url)firstAudio=url;pin.insertAdjacentHTML('beforeend',`<div class="pron">${url?`<button title="Play" data-audio="${esc(url)}"><span class="speaker"><span class="body"></span><span class="cone"></span><span class="wave1"></span><span class="wave2"></span><span class="wave3"></span></span></button>`:''}<span class="ipa">${esc(ipa)}</span><span class="accent">US</span></div>`)});const short=(entry.shortdef||[]).slice(0,1);let summary=short.length?cleanMW(short[0]):'';const defs=getDefinitions(entry);if(!summary&&defs.length)summary=defs[0].text;el.querySelector('.brief').textContent=summary||'No short definition returned.';let details='';if(defs.length){details+=`<div class="pos">${esc(entry.fl||'definition')}</div><ol class="defs">`;defs.slice(0,12).forEach(d=>{details+=`<li>${esc(d.text)}${d.example?`<div class="example">Example: ${esc(d.example)}</div>`:''}</li>`});details+='</ol>'}else if(summary)details=`<div class="pos">${esc(entry.fl||'definition')}</div><div class="brief">${esc(summary)}</div>`;details+=`<div class="mw">Source: Merriam-Webster ${data.source==='school'?'School Dictionary':'Collegiate Dictionary'}</div>`;el.querySelector('.details').innerHTML=details;el.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>play(b.dataset.audio,b));if(autoPlay&&firstAudio){const auto=new Audio(firstAudio);auto.preload='auto';auto.play().catch(e=>console.warn('Automatic first pronunciation was blocked by browser policy',e))}}catch(e){el.querySelector('.brief').outerHTML=`<div class="error">${esc(e.message)}</div>`}}function loadWordsFromUrl(){const params=new URLSearchParams(location.search);const raw=params.get('word_list');if(!raw)return;parseWords(raw).slice(0,100).forEach(word=>addWord(word,false))}createSearchCard();loadWordsFromUrl();</script></body></html>
