<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Pronunciation Compare</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:auto;padding:10px 12px 24px}.top{padding:0 0 5px}.title{font-size:22px;font-weight:780;margin:2px 0}.cards{display:flex;flex-direction:column;gap:5px}.card{background:#fff;border:1px solid #dfe3e7;border-radius:10px;padding:6px 9px;box-shadow:0 1px 5px #00000006}.head{display:flex;align-items:center;gap:5px;min-height:26px}.word{font-size:18px;font-weight:760;overflow-wrap:anywhere}.pron-inline{display:flex;align-items:center;gap:3px;margin-left:3px}.pron{display:flex;align-items:center;gap:3px}.pron button{border:0;background:transparent;padding:1px 2px;font-size:15px;cursor:pointer}.pron button:disabled{opacity:.5}.ipa{font-size:12px}.accent{font-size:8px;color:#68717c;font-weight:750;text-transform:uppercase}.close,.expand{border:0;border-radius:7px;background:#eef0f2;color:#59616b;padding:4px 6px;font-size:11px}.close{font-size:16px;padding:1px 6px}.expand{margin-left:auto}.summary{padding-top:1px}.brief{font-size:11px;color:#414952;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}.details{display:none;margin-top:5px;border-top:1px solid #edf0f2;padding-top:5px}.card.open .details{display:block}.pos{font-size:9px;color:#68717c;font-weight:750;text-transform:uppercase;letter-spacing:.04em;margin:4px 0 2px}.defs{margin:0;padding-left:16px}.defs li{margin:3px 0;line-height:1.3;font-size:11px}.example{font-size:10px;color:#747d87;margin-top:1px}.loading{font-size:11px;color:#747d87;padding:2px 0}.error{font-size:10px;color:#a32d2d;background:#fff1f0;border-radius:7px;padding:6px;margin-top:3px}.mw{font-size:8px;color:#8a929b;margin-top:5px}.search-card{border:1px dashed #cbd1d7;box-shadow:none}.search-row{display:flex;gap:5px}.search-row input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px;padding:3px 1px}.search-row button{width:32px;height:28px;border:0;border-radius:8px;background:#202632;color:#fff;font-size:17px;font-weight:700}.search-label{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="title">Word Pronunciation Compare</div></header>
<main id="cards" class="cards"></main>
</div>
<script>
const API_BASE='https://word-pronunciation-api.hawkincasper.workers.dev';
const cards=document.getElementById('cards');const state=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanMW(s){return String(s??'').replace(/\{bc\}/g,'').replace(/\{it\}|\{\/it\}/g,'').replace(/\{b\}|\{\/b\}/g,'').replace(/\{wi\}|\{\/wi\}/g,'').replace(/\{a_link\|([^}]+)\}/g,'$1').replace(/\{a_href\|([^|}]+)(?:\|[^}]*)?\}/g,'$1').replace(/\{[^}]+\}/g,'').replace(/\s+/g,' ').trim()}
function audioUrl(id){if(!id)return null;const sub=/^bix/i.test(id)?'bix':/^gg/i.test(id)?'gg':/^[0-9_-]/.test(id)?'number':id[0].toLowerCase();return `https://media.merriam-webster.com/audio/prons/en/us/mp3/${sub}/${id}.mp3`}
function play(url,btn){if(!url)return;const a=new Audio(url);if(btn)btn.disabled=true;a.play().catch(e=>console.warn('Audio playback failed',e)).finally(()=>{if(btn)btn.disabled=false})}
function getDefinitions(entry){const out=[];for(const d of (entry.def||[]))for(const seq of (d.sseq||[]))for(const group of seq||[]){if(!Array.isArray(group)||group[0]!=='sense')continue;const obj=group[1]||{};const texts=[];for(const dt of (obj.dt||[])){if(dt[0]==='text')texts.push(cleanMW(dt[1]));else if(dt[0]==='vis'&&Array.isArray(dt[1]))for(const v of dt[1])if(v&&v.t)texts.push('Example: '+cleanMW(v.t))}if(texts.length)out.push({text:texts[0],example:texts.find(x=>x.startsWith('Example:'))?.replace(/^Example:\s*/,'')});if(obj.sdsense?.dt){const t=obj.sdsense.dt.find(x=>x[0]==='text');if(t)out.push({text:cleanMW(t[1])})}}return out}
function createSearchCard(){const el=document.createElement('section');el.className='card search-card';el.innerHTML='<div class="search-row"><input id="input" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search word…"><button id="add" aria-label="Search">＋</button></div>';cards.appendChild(el);const input=el.querySelector('#input');const add=el.querySelector('#add');const submit=()=>addWord(input.value);add.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})}
function addWord(raw){const word=raw.trim();if(!word)return;const key=word.toLowerCase();const input=document.getElementById('input');if(input)input.value='';if(state.has(key)){document.getElementById('card-'+state.get(key)).scrollIntoView({behavior:'smooth',block:'center'});return}const id=Math.random().toString(36).slice(2);state.set(key,id);const searchCard=document.querySelector('.search-card');const el=document.createElement('section');el.className='card';el.id='card-'+id;el.innerHTML=`<div class="head"><div class="word">${esc(word)}</div><div class="pron-inline" data-pron></div><button class="expand">展开</button><button class="close" title="Remove">×</button></div><div class="summary"><div class="brief loading">Searching…</div></div><div class="details"></div>`;el.querySelector('.close').onclick=()=>{state.delete(key);el.remove()};el.querySelector('.expand').onclick=()=>{el.classList.toggle('open');el.querySelector('.expand').textContent=el.classList.contains('open')?'收起':'展开'};cards.insertBefore(el,searchCard);el.scrollIntoView({behavior:'smooth',block:'center'});fetchWord(word,el)}
async function fetchWord(word,el){try{const r=await fetch(API_BASE+'/lookup?word='+encodeURIComponent(word));let data;try{data=await r.json()}catch{throw new Error('API returned an invalid response')}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));const entry=data.entries?.[0];if(!entry)throw new Error('No dictionary entry returned');const prs=(entry.hwi?.prs||[]).filter(p=>p.sound?.audio||p.mw||p.ipa);const pin=el.querySelector('[data-pron]');prs.forEach(p=>{const id=p.sound?.audio,url=audioUrl(id),ipa=p.ipa||p.mw||'';pin.insertAdjacentHTML('beforeend',`<div class="pron">${url?`<button title="Play" data-audio="${esc(url)}">▶</button>`:''}<span class="ipa">${esc(ipa)}</span><span class="accent">US</span></div>`)});const short=(entry.shortdef||[]).slice(0,1);let summary=short.length?cleanMW(short[0]):'';const defs=getDefinitions(entry);if(!summary&&defs.length)summary=defs[0].text;el.querySelector('.brief').textContent=summary||'No short definition returned.';let details='';if(defs.length){details+=`<div class="pos">${esc(entry.fl||'definition')}</div><ol class="defs">`;defs.slice(0,12).forEach(d=>{details+=`<li>${esc(d.text)}${d.example?`<div class="example">Example: ${esc(d.example)}</div>`:''}</li>`});details+='</ol>'}else if(summary)details=`<div class="pos">${esc(entry.fl||'definition')}</div><div class="brief">${esc(summary)}</div>`;details+=`<div class="mw">Source: Merriam-Webster ${data.source==='school'?'School Dictionary':'Collegiate Dictionary'}</div>`;el.querySelector('.details').innerHTML=details;el.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>play(b.dataset.audio,b))}catch(e){el.querySelector('.brief').outerHTML=`<div class="error">${esc(e.message)}</div>`}}
createSearchCard();
</script>
</body>
</html>
