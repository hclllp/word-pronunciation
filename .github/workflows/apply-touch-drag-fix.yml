name: Apply touch drag fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix touch drag interruption') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch compare.html
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('compare.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.body.reordering .card:not(.dragging){touch-action:none}', 'body.reordering .card:not(.dragging){touch-action:none}')
          start=s.index('function setupDrag(el){')
          end=s.index('\nfunction init(){', start)
          new=r'''function setupDrag(el){let timer=null,active=false,moved=false,pressed=false,pid=null,startX=0,startY=0,lastX=0,lastY=0,offsetX=0,offsetY=0,placeholder=null;
const blocked=t=>!!t.closest('button,input,.search-card');
const cancel=()=>{if(timer){clearTimeout(timer);timer=null}};
const cleanup=()=>{cancel();document.body.classList.remove('reordering');el.classList.remove('dragging');el.style.position='';el.style.left='';el.style.top='';el.style.width='';el.style.height='';el.style.zIndex='';el.style.pointerEvents='';if(placeholder){placeholder.replaceWith(el);placeholder=null}active=false;pressed=false;pid=null;el._dragHandled=true;el._clickBlocked=true;setTimeout(()=>{el._dragHandled=false;el._clickBlocked=false},0)};
function movePlaceholder(y){const items=[...cards.querySelectorAll('.card[data-word]')].filter(x=>x!==el);let target=null;for(const item of items){const r=item.getBoundingClientRect();if(y<r.top+r.height/2){target=item;break}}if(target){if(placeholder.nextElementSibling!==target)cards.insertBefore(placeholder,target)}else{const search=cards.querySelector('.search-card');if(search&&placeholder.nextElementSibling!==search)cards.insertBefore(placeholder,search)}}
function begin(){if(!pressed||active)return;active=true;el._dragHandled=true;document.body.classList.add('reordering');const r=el.getBoundingClientRect();offsetX=lastX-r.left;offsetY=lastY-r.top;placeholder=document.createElement('div');placeholder.className='drag-placeholder';placeholder.style.height=r.height+'px';placeholder.style.width=r.width+'px';cards.insertBefore(placeholder,el);el.classList.add('dragging');el.style.position='fixed';el.style.left=(lastX-offsetX)+'px';el.style.top=(lastY-offsetY)+'px';el.style.width=r.width+'px';el.style.height=r.height+'px';el.style.zIndex='1000';el.style.pointerEvents='none';movePlaceholder(lastY)}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;if(blocked(e.target)||active)return;pid=e.pointerId;startX=lastX=e.clientX;startY=lastY=e.clientY;moved=false;pressed=true;el._clickBlocked=false;cancel();timer=setTimeout(begin,500)}
function move(e){if(pid!==e.pointerId)return;lastX=e.clientX;lastY=e.clientY;const dx=lastX-startX,dy=lastY-startY;if(!active){if(Math.hypot(dx,dy)>8){moved=true;pressed=false;cancel()}return}e.preventDefault();e.stopPropagation();el.style.left=(lastX-offsetX)+'px';el.style.top=(lastY-offsetY)+'px';movePlaceholder(lastY);const edge=55;if(lastY<edge)window.scrollBy(0,-12);else if(lastY>innerHeight-edge)window.scrollBy(0,12)}
function up(e){if(pid!==e.pointerId)return;cancel();if(active)cleanup();else if(moved){el._clickBlocked=true;setTimeout(()=>el._clickBlocked=false,0)}else if(pressed){el._clickBlocked=false}pressed=false;pid=null}
function abort(e){if(pid!==e.pointerId)return;cancel();if(active)cleanup();pressed=false;pid=null}
el.addEventListener('pointerdown',down,{passive:false});document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',up,{passive:false});document.addEventListener('pointercancel',abort,{passive:false});
}'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compare.html
          git commit -m 'fix touch drag interruption'
          git rm .github/workflows/apply-touch-drag-fix.yml
          git commit -m 'chore: remove temporary touch drag workflow'
          git push origin HEAD:main
