name: Fix audio download

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'Fix audio download')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch compare.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('compare.html')
          s = p.read_text()
          old = re.search(r"async function prepareAudio\(url,el\)\{.*?\nfunction showToast", s, re.S)
          if not old:
              raise SystemExit('audio functions not found')
          new = '''async function prepareAudio(url,el){try{const r=await fetch(url,{mode:'cors',cache:'no-store'});if(!r.ok)throw Error(`音频请求失败（HTTP ${r.status}）`);const bytes=await r.arrayBuffer();if(!bytes.byteLength)throw Error('音频数据为空');const ctx=new(window.AudioContext||window.webkitAudioContext)(),buffer=await ctx.decodeAudioData(bytes.slice(0));try{await ctx.close()}catch{}el._audio={url,bytes,buffer,duration:buffer.duration};el.querySelector('.download').disabled=false;return el._audio}catch(error){el._audio={url,duration:null,error};el.querySelector('.download').disabled=false;return null}}
          async function downloadAudio(url,word,btn,el){const old=btn.textContent;btn.textContent='处理中…';try{if(!url)throw Error('没有可用的音频');const m=await prepareAudio(url,el);if(!m?.buffer)throw(m?.error||Error('音频无法解码'));const source=m.buffer;let output=source;if(source.duration<MIN_DOWNLOAD_DURATION){const frames=Math.ceil(source.sampleRate*MIN_DOWNLOAD_DURATION),ctx=new OfflineAudioContext(source.numberOfChannels,frames,source.sampleRate),node=ctx.createBufferSource();node.buffer=source;node.connect(ctx.destination);node.start();output=await ctx.startRendering()}const blob=writeWav(output),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${word}.wav`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}catch(error){console.error('Audio download failed:',error);showToast(`音频处理失败：${error?.message||'无法解码音频'}`)}finally{btn.textContent=old}}
          function showToast'''
          s = s[:old.start()] + new + s[old.end():]
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-audio-download.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compare.html .github/workflows/fix-audio-download.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix audio download'
          git push