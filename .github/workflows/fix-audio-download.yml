name: Fix audio download diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-audio-download.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch compare page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('compare.html')
          s=p.read_text(encoding='utf-8')
          css='.audio-debug{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,720px);max-height:82vh;overflow:auto;background:#202632;color:#fff;border-radius:12px;padding:14px;z-index:1200;box-shadow:0 20px 60px #0007;font-size:11px;line-height:1.45}.audio-debug-title{font-size:14px;font-weight:700;margin-bottom:8px}.audio-debug-close{float:right;border:0;border-radius:6px;background:#eef0f2;color:#202632;padding:4px 8px}.audio-debug-log{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;margin:0;white-space:pre-wrap;word-break:break-word}'
          if '.audio-debug{' not in s:
              s=s.replace('body.reordering .top{pointer-events:none}', 'body.reordering .top{pointer-events:none}'+css)
          if 'id="audio-debug"' not in s:
              s=s.replace('<div id="toast" class="toast"></div>', '<div id="toast" class="toast"></div><div id="audio-debug" class="audio-debug" hidden><button class="audio-debug-close" onclick="document.getElementById(\'audio-debug\').hidden=true">关闭</button><div class="audio-debug-title">音频处理诊断</div><pre class="audio-debug-log"></pre></div>')
          start=s.find('async function downloadAudio(')
          end=s.find('function showToast(',start)
          if start<0 or end<0: raise SystemExit('downloadAudio function not found')
          block=r'''async function downloadAudio(url,word,btn,el){const old=btn.textContent;btn.textContent='处理中…';const logs=[];try{if(!url)throw Error('没有可用的音频');const wavUrl=url.replace('/mp3/','/wav/').replace(/\.mp3$/i,'.wav');logs.push(`[开始] MP3 URL：${url}`);logs.push(`[策略] 优先取得 Merriam-Webster WAV：${wavUrl}`);try{const wb=await fetchBytes(wavUrl,'MW WAV',logs);if(wb.byteLength>=44&&new TextDecoder().decode(wb.slice(0,4))==='RIFF'&&new TextDecoder().decode(wb.slice(8,12))==='WAVE'){const b=await decodeBytes(wb,'MW WAV',logs);if(b.duration<MIN_DOWNLOAD_DURATION){const frames=Math.ceil(b.sampleRate*MIN_DOWNLOAD_DURATION),ctx=new OfflineAudioContext(b.numberOfChannels,frames,b.sampleRate),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start();downloadBlob(writeWav(await ctx.startRendering()),word);logs.push(`[补齐] ${b.duration.toFixed(4)} s → 1.1000 s`)}else downloadBlob(new Blob([wb],{type:'audio/wav'}),word);return}else logs.push('[MW WAV] 不是标准 RIFF/WAVE，转入 MP3 路径')}catch(e){logs.push(`[MW WAV] 失败：${e?.name||'Error'} / ${e?.message||e}`)}const mb=await fetchBytes(url,'MP3',logs);let b;try{b=await decodeBytes(mb,'MP3',logs)}catch(e){logs.push('[MP3] 标准解码失败；HTMLAudio 也可能失败。记录媒体错误后停止，避免生成损坏文件');const blobUrl=URL.createObjectURL(new Blob([mb],{type:'audio/mpeg'})),audio=new Audio();audio.preload='auto';audio.src=blobUrl;audio.onloadedmetadata=()=>logs.push(`[HTMLAudio] metadata：duration=${Number.isFinite(audio.duration)?audio.duration.toFixed(4):'NaN'} readyState=${audio.readyState} networkState=${audio.networkState}`);await new Promise((resolve,reject)=>{audio.onloadeddata=resolve;audio.onerror=()=>{const er=audio.error;logs.push(`[HTMLAudio] ERROR：code=${er?.code??'null'} message=${er?.message||'无'} readyState=${audio.readyState} networkState=${audio.networkState}`);reject(Error('Load failed'))};audio.load()});throw e}if(b.duration<MIN_DOWNLOAD_DURATION){const frames=Math.ceil(b.sampleRate*MIN_DOWNLOAD_DURATION),ctx=new OfflineAudioContext(b.numberOfChannels,frames,b.sampleRate),n=ctx.createBufferSource();n.buffer=b;n.connect(ctx.destination);n.start();b=await ctx.startRendering();logs.push('[补齐] MP3 PCM 已补至 1.1000 s')}downloadBlob(writeWav(b),word)}catch(e){logs.push(`[最终失败] ${e?.name||'Error'} / ${e?.message||e}`);console.error('Audio download failed:',e,logs);audioDiag(word,logs)}finally{btn.textContent=old}}
          '''
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compare.html
          git commit -m 'Fix audio download patch target [skip ci]' || exit 0
          git push
