name: Fix card reorder interaction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Improve card reordering interaction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace reorder implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('compare.html')
          s = p.read_text(encoding='utf-8')
          new = r'''function setupReorder(el){let sx=0,sy=0,moved=false,drag=false,suppressClick=false,timer=null,placeholder=null,startRect=null,dy=0;const cleanup=()=>{clearTimeout(timer);timer=null;drag=false;el.classList.remove('reorder-armed','reorder-moving');el.style.position='';el.style.left='';el.style.top='';el.style.width='';el.style.transform='';el.style.zIndex='';if(placeholder){placeholder.replaceWith(el);placeholder=null}try{el.releasePointerCapture(el._pid)}catch{}};el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;el._pid=e.pointerId;sx=e.clientX;sy=e.clientY;moved=false;drag=false;suppressClick=false;clearTimeout(timer);timer=setTimeout(()=>{if(!moved&&!el.isConnected)return;if(!moved){drag=true;suppressClick=true;startRect=el.getBoundingClientRect();dy=0;placeholder=document.createElement('div');placeholder.className='reorder-placeholder';placeholder.style.height=startRect.height+'px';placeholder.style.margin=getComputedStyle(el).margin;el.before(placeholder);el.style.position='fixed';el.style.left=startRect.left+'px';el.style.top=startRect.top+'px';el.style.width=startRect.width+'px';el.style.zIndex='50';el.classList.add('reorder-armed','reorder-moving');try{el.setPointerCapture(e.pointerId)}catch{}}},500)},false);el.addEventListener('pointermove',e=>{const dx=e.clientX-sx,moveY=e.clientY-sy;if(Math.hypot(dx,moveY)>8)moved=true;if(!drag){if(moved){clearTimeout(timer);timer=null}return}e.preventDefault();dy=moveY;el.style.transform=`translateY(${dy}px) scale(1.015)`;const y=e.clientY;const candidates=[...cards.querySelectorAll('.card[data-word]')].filter(x=>x!==el);let target=null;for(const other of candidates){const r=other.getBoundingClientRect();if(y<r.top+r.height/2){target=other;break}}if(target){if(placeholder.nextElementSibling!==target)cards.insertBefore(placeholder,target)}else{const last=candidates[candidates.length-1];if(last&&placeholder!==last.nextElementSibling)cards.insertBefore(placeholder,last.nextElementSibling)}});el.addEventListener('pointerup',e=>{clearTimeout(timer);timer=null;if(drag){cleanup();return}if(moved){moved=false;suppressClick=true;return}});el.addEventListener('pointercancel',()=>{clearTimeout(timer);timer=null;if(drag)cleanup();else{suppressClick=true}});el.addEventListener('click',e=>{if(e.target.closest('button'))return;if(suppressClick){suppressClick=false;return}toggleCard(el)})}'''
          pattern = r'function setupReorder\(el\)\{.*?\}function addWord\('
          replacement = new + 'function addWord('
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Could not replace setupReorder, matches={n}')
          ns = ns.replace('.card.reorder-moving{opacity:.92}', '.card.reorder-moving{opacity:.96}.reorder-placeholder{background:#e8ebee;border:1px dashed #bfc6cd;border-radius:10px;box-shadow:none}')
          p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compare.html .github/workflows/fix-reorder.yml
          git rm .github/workflows/fix-reorder.yml
          git commit -m "Improve card reordering interaction"
          git push